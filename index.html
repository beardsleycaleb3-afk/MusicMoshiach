<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes"> 
  <meta name="theme-color" content="#ff7a00">
  <meta name="color-scheme" content="dark">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    :root {
      --hue: 30;
      --frame: hsl(var(--hue), 100%, 50%);
      --btn: hsl(calc(var(--hue) + 180), 100%, 50%);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    body {
      width: 100dvw;
      height: 100dvh;
      border: 5px solid var(--frame);
      position: relative;
    }
    #renderCanvas {
      position: absolute;
      top: 5px; left: 5px;
      width: calc(100dvw - 10px);
      height: calc(100dvh - 148px);
      outline: none;
      touch-action: none;
      z-index: 1;
      background: #000;
      display: block;
    }
    #hud {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 143px;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 3px 5px 6px;
    }
    #track-info {
      color: var(--frame);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 94%;
    }
    #mode-label {
      color: var(--frame);
      font-size: 0.68rem;
      text-align: center;
    }
    #vol-slider {
      width: 74%;
      height: 11px;
      appearance: none;
      background: #222;
      outline: none;
      border-radius: 6px;
    }
    #vol-slider::-webkit-slider-thumb {
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--btn);
    }
    .deck {
      display: flex;
      gap: 5px;
      justify-content: center;
      width: 96%;
      padding: 5px;
      border: 1px solid var(--frame);
    }
    .btn {
      width: 40px; height: 44px;
      border: 1px solid var(--btn);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn span { font-size: 19px; pointer-events: none; }
    #playlist-screen {
      position: absolute;
      inset: 0;
      background: #0c140c;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 6px;
      overflow-y: auto;
      touch-action: pan-y;
    }
    #close-playlist {
      text-align: right;
      color: #fff;
      font-size: 22px;
      padding: 6px 10px;
      touch-action: manipulation;
    }
    .track-item {
      padding: 11px 7px;
      color: var(--frame);
      border-bottom: 2px solid #222;
      font-size: 1.05rem;
      touch-action: manipulation;
    }
    #install-banner {
      display: none;
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      background: #111;
      border: 2px solid var(--frame);
      color: var(--frame);
      padding: 9px 14px;
      font-size: 0.82rem;
      text-align: center;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="install-banner">install MusicMoshiach</div>

  <div id="playlist-screen">
    <div id="close-playlist">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">BPM: -- | Gravity: still</div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
    <div class="deck">
      <div class="btn" id="btn-play" role="button"><span>⏯️</span></div>
      <div class="btn" id="btn-skip" role="button"><span>⏭️</span></div>
      <div class="btn" id="btn-color" role="button"><span>👻</span></div>
      <div class="btn" id="btn-gravity" role="button"><span>🎛️</span></div>
      <div class="btn" id="btn-playlist" role="button"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {
  started: false,
  trackIndex: 0,
  hue: 30,
  currentBg: null,
  lastCycleAt: 0,
  estimatedBpm: 0,
  deferredPrompt: null
};

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const songTitles = {
  "9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3":"frequencies death","24.mp3":"death frequency 2","25.mp3":"false star","26.mp3":"Fifteen Trillion","27.mp3":"fractured shadow","28.mp3":"FOD","29.mp3":"FOD 4","30.mp3":"Gods King of Kings","31.mp3":"Hidden Sultan of Vishnu","32.mp3":"hiss","33.mp3":"Hook Will NAIL You","34.mp3":"HOOKED ON THE HISS","35.mp3":"Ignition Arch. X NanoFile","38.mp3":"limit breaks","39.mp3":"MOON Monster Melody X Comment","40.mp3":"New one","41.mp3":"no blanking","42.mp3":"noise swells","43.mp3":"phantom X Hidden","44.mp3":"phoenix dark","45.mp3":"planet command","46.mp3":"Roll over Once","47.mp3":"rust fold","48.mp3":"ss ii py f","49.mp3":"ten by seven","50.mp3":"the dark","51.mp3":"the hook","52.mp3":"THE TRUTH","53.mp3":"The prophecy","55.mp3":"tuned for death","56.mp3":"unsteady echo","57.mp3":"ur decension","58.mp3":"When the curtain moves","59.mp3":"wildcard subnet","60.mp3":"yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"
};

/* Every visual image in the repo – BGs + cores – lives in one rotating pool.
   Prefix tells the loader which folder to hit. */
const ALL_IMAGES = [
  // backgrounds
  ...['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg',
      '11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg',
      '21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg',
      '31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg',
      '42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg',
      '52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg',
      '64.jpg','65.jpg'].map(f => ({ file: f, folder: 'bg' })),
  // cores
  ...['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg',
      'd.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg',
      'g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg',
      'jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg',
      'mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg',
      'qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg',
      'v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg']
      .map(f => ({ file: f, folder: 'core' }))
];

function makeDeque(list) {
  // shuffle once so every image gets used in mixed order
  const items = list.slice();
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return {
    items,
    enqueue(v) { if (v) this.items.push(v); },
    dequeue() { return this.items.length ? this.items.shift() : null; },
    peekAt(n) { return this.items.length ? this.items[n % this.items.length] : null; }
  };
}
const ImagePool = makeDeque(ALL_IMAGES);

const SPHERE_COUNT = 3;
const CYCLE_MS = 8500;
const BEAT_COOLDOWN = 2000;
const GRAVITY_MODES = ['fall', 'rise', 'still', 'orbit'];

/* ── Audio ── */
const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyser: null,
  data: new Uint8Array(128),
  source: null,
  lastBeatAt: 0,
  intervals: [],

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.7;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
    this.audio.crossOrigin = 'anonymous';
    this.audio.volume = 1;
  },
  ensure() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  bins() {
    if (!this.analyser) return this.data;
    this.analyser.getByteFrequencyData(this.data);
    return this.data;
  },
  intensity() {
    const b = this.bins();
    let s = 0;
    for (let i = 0; i < 32; i++) s += b[i];
    return s / (32 * 255);
  },
  bass() {
    const b = this.bins();
    let s = 0;
    for (let i = 0; i < 8; i++) s += b[i];
    return s / (8 * 255);
  },
  detectBeat() {
    const bass = this.bass();
    const now = performance.now();
    if (bass > 0.46 && now - this.lastBeatAt > 145) {
      if (this.lastBeatAt > 0) {
        this.intervals.push(now - this.lastBeatAt);
        if (this.intervals.length > 12) this.intervals.shift();
        const sorted = this.intervals.slice().sort((a, b) => a - b);
        State.estimatedBpm = Math.round(60000 / sorted[Math.floor(sorted.length / 2)]);
      }
      this.lastBeatAt = now;
      return bass;
    }
    return 0;
  },
  load(i) {
    State.trackIndex = i;
    this.audio.src = `assets/audio/${playlist[i]}`;
    document.getElementById('track-info').textContent = songTitles[playlist[i]] || playlist[i];
    this.audio.play().catch(() => {});
    this.ensure();
    this.intervals = [];
    if (State.started) {
      Cascade.advance(true);
      State.lastCycleAt = performance.now();
    }
  },
  toggle() {
    this.audio.paused ? this.audio.play().catch(() => {}) : this.audio.pause();
    this.ensure();
  },
  setVol(v) { this.audio.volume = +v; }
};

/* ── Cascade: every image is always on something ──
   Layout at any moment:
     sky  = currentBg
     s0   = next image (large sphere)
     s1   = next image (medium sphere)
     s2   = next image (small sphere)
   On advance:
     sky  → falls off (back to pool)
     s0 becomes new sky
     s1 → s0, s2 → s1
     fresh image from pool → s2
   Result: every asset rotates through sky + all three spheres forever.
*/
const Cascade = {
  slots: [null, null, null], // the three spheres
  init() {
    State.currentBg = ImagePool.dequeue();
    for (let i = 0; i < SPHERE_COUNT; i++) {
      this.slots[i] = ImagePool.dequeue();
    }
    Visual.applySky(State.currentBg);
    for (let i = 0; i < SPHERE_COUNT; i++) {
      Visual.applySphere(i, this.slots[i]);
    }
    this.preload();
  },
  advance(force) {
    // old sky returns to the pool
    if (State.currentBg) ImagePool.enqueue(State.currentBg);

    // large sphere becomes the new sky
    State.currentBg = this.slots[0];

    // shift spheres forward
    this.slots[0] = this.slots[1];
    this.slots[1] = this.slots[2];
    this.slots[2] = ImagePool.dequeue();

    // re-queue anything that somehow came back null
    if (!this.slots[2]) this.slots[2] = ImagePool.dequeue();

    Visual.applySky(State.currentBg);
    for (let i = 0; i < SPHERE_COUNT; i++) {
      Visual.applySphere(i, this.slots[i]);
    }
    this.preload();
  },
  preload() {
    for (let n = 0; n < 5; n++) {
      const peek = ImagePool.peekAt(n);
      if (peek) Visual.preload(peek);
    }
    if (State.currentBg) Visual.preload(State.currentBg);
    this.slots.forEach(s => s && Visual.preload(s));
  }
};

/* ── Babylon – 3 spheres only, always fully wrapped ── */
const Visual = {
  engine: null,
  scene: null,
  camera: null,
  sky: null,
  skyMat: null,
  spheres: [],
  gravity: 0,
  touch: { x: 0, y: 0 },
  lastBeatCycle: 0,
  cache: new Map(),

  init() {
    const canvas = document.getElementById('renderCanvas');
    this.engine = new BABYLON.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      adaptToDeviceRatio: true
    });
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.engine.setHardwareScalingLevel(1 / dpr);

    this.scene = new BABYLON.Scene(this.engine);
    this.scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

    this.camera = new BABYLON.ArcRotateCamera(
      'cam', -Math.PI / 2, Math.PI / 2.25, 14, BABYLON.Vector3.Zero(), this.scene
    );
    this.camera.lowerRadiusLimit = 5;
    this.camera.upperRadiusLimit = 26;
    this.camera.panningSensibility = 0;
    this.camera.attachControl(canvas, false);

    const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.2, 1, 0.3), this.scene);
    hemi.intensity = 0.5;
    const pt = new BABYLON.PointLight('p', new BABYLON.Vector3(0, 5, 4), this.scene);
    pt.intensity = 0.4;

    // Full-environment sky sphere – image always covers entire view
    this.sky = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 80, segments: 32 }, this.scene);
    this.skyMat = new BABYLON.StandardMaterial('skyMat', this.scene);
    this.skyMat.backFaceCulling = false;
    this.skyMat.disableLighting = true;
    this.skyMat.emissiveColor = BABYLON.Color3.White();
    this.sky.material = this.skyMat;
    this.sky.infiniteDistance = true;

    // Three spheres – different sizes, always image-wrapped
    const sizes = [4.2, 2.7, 1.6];
    const offsets = [
      new BABYLON.Vector3(0, 0, 0),
      new BABYLON.Vector3(3.8, 1.2, -1.5),
      new BABYLON.Vector3(-3.2, -1.4, 2.0)
    ];

    for (let i = 0; i < SPHERE_COUNT; i++) {
      const mesh = BABYLON.MeshBuilder.CreateSphere(`s${i}`, {
        diameter: sizes[i],
        segments: 28
      }, this.scene);

      const mat = new BABYLON.StandardMaterial(`m${i}`, this.scene);
      mat.diffuseColor = BABYLON.Color3.White();
      mat.emissiveColor = new BABYLON.Color3(0.35, 0.35, 0.35);
      mat.specularColor = new BABYLON.Color3(0.08, 0.08, 0.08);
      mesh.material = mat;
      mesh.position = offsets[i].clone();

      this.spheres.push({
        mesh,
        mat,
        base: offsets[i].clone(),
        phase: Math.random() * Math.PI * 2,
        spin: new BABYLON.Vector3(
          (Math.random() - 0.5) * 0.018,
          (Math.random() - 0.5) * 0.022,
          (Math.random() - 0.5) * 0.01
        ),
        size: sizes[i]
      });
    }

    this.engine.runRenderLoop(() => this.tick());
    window.addEventListener('resize', () => this.engine.resize());
  },

  url(item) {
    if (!item) return null;
    return `assets/audio/${item.folder}/${item.file}`;
  },

  preload(item) {
    const u = this.url(item);
    if (!u || this.cache.has(u)) return this.cache.get(u);
    const tex = new BABYLON.Texture(u, this.scene, false, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
    // sphere-friendly wrap so the image always covers the whole surface
    tex.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
    tex.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
    tex.uScale = 1;
    tex.vScale = 1;
    this.cache.set(u, tex);
    return tex;
  },

  applySky(item) {
    if (!item || !this.skyMat) return;
    const tex = this.preload(item);
    this.skyMat.emissiveTexture = tex;
    this.skyMat.diffuseTexture = tex;
    this.skyMat.emissiveColor = BABYLON.Color3.White();
  },

  applySphere(index, item) {
    if (!item || !this.spheres[index]) return;
    const tex = this.preload(item);
    // force full coverage
    tex.uScale = 1;
    tex.vScale = 1;
    const { mat } = this.spheres[index];
    mat.diffuseTexture = tex;
    mat.emissiveTexture = tex;
    mat.emissiveColor = new BABYLON.Color3(0.4, 0.4, 0.4);
    mat.diffuseColor = BABYLON.Color3.White();
  },

  cycleGravity() {
    this.gravity = (this.gravity + 1) % GRAVITY_MODES.length;
    this.label();
  },

  label() {
    const bpm = State.estimatedBpm > 40 ? State.estimatedBpm : '--';
    document.getElementById('mode-label').textContent =
      `BPM: ${bpm} | Gravity: ${GRAVITY_MODES[this.gravity]}`;
  },

  registerTouch(x, y) {
    const r = this.engine.getRenderingCanvas().getBoundingClientRect();
    this.touch = {
      x: ((x - r.left) / r.width) * 2 - 1,
      y: -(((y - r.top) / r.height) * 2 - 1)
    };
  },

  tick() {
    if (!this.scene) return;
    const intensity = AudioLayer.intensity();
    const bass = AudioLayer.bass();
    const beat = AudioLayer.detectBeat();
    const now = performance.now();
    const t = now * 0.001;

    // cascade on time or beat
    if (now - State.lastCycleAt > CYCLE_MS) {
      Cascade.advance();
      State.lastCycleAt = now;
    } else if (beat > 0 && now - this.lastBeatCycle > BEAT_COOLDOWN) {
      Cascade.advance();
      this.lastBeatCycle = now;
      State.lastCycleAt = now;
    }

    if (Math.floor(t * 2) % 2 === 0) this.label();

    // touch drives camera
    this.camera.alpha += this.touch.x * 0.016;
    this.camera.beta = BABYLON.Scalar.Clamp(
      this.camera.beta - this.touch.y * 0.013,
      0.25, Math.PI - 0.25
    );

    const mode = GRAVITY_MODES[this.gravity];

    this.spheres.forEach((s, i) => {
      const { mesh, mat, base, phase, spin } = s;

      // continuous spin + audio
      mesh.rotation.x += spin.x * (1 + intensity * 2.4 + bass * 1.6);
      mesh.rotation.y += spin.y * (1 + intensity * 2.0);
      mesh.rotation.z += spin.z * (1 + bass * 1.2);

      // scale pulse so the wrapped image breathes
      const pulse = 1 + intensity * 0.22 + bass * 0.32 * (i === 0 ? 1 : 0.7);
      mesh.scaling.setAll(pulse);

      // motion
      let y = Math.sin(t * 0.55 + phase) * (0.9 - i * 0.15);
      let x = Math.cos(t * 0.4 + phase) * (0.7 + intensity * 0.5);
      let z = Math.sin(t * 0.48 + phase * 1.1) * (0.6 + intensity * 0.4);

      if (mode === 'fall') y -= ((t * 0.28 + i) % 4) - 2;
      if (mode === 'rise') y += ((t * 0.28 + i) % 4) - 2;
      if (mode === 'orbit') {
        const a = t * 0.35 + i * 2.1;
        x = Math.cos(a) * (3.5 - i * 0.8);
        z = Math.sin(a) * (3.5 - i * 0.8);
        y = Math.sin(a * 1.4) * 1.2;
      }

      mesh.position.x = base.x + x;
      mesh.position.y = base.y + y;
      mesh.position.z = base.z + z;

      // image itself glows with the bass
      const g = 0.35 + bass * 0.5 + intensity * 0.2;
      mat.emissiveColor.set(g, g * 0.92, g * 0.85);
    });

    // slow sky drift
    this.sky.rotation.y += 0.0005 + intensity * 0.0012;

    this.scene.render();
  }
};

/* ── UI ── */
const UI = {
  toggleList() {
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  color() {
    State.hue = (State.hue + 24) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildList() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track-item';
      el.textContent = songTitles[t] || t;
      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.load(i);
        this.toggleList();
      }, { passive: false });
      list.appendChild(el);
    });
  }
};

/* ── Touch only ── */
const Input = {
  pid: null,
  start() {
    if (State.started) return;
    AudioLayer.init();
    Visual.init();
    Cascade.init();
    UI.buildList();
    State.started = true;
    State.lastCycleAt = performance.now();
    AudioLayer.load(0);
  },
  skip(n) {
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.load(State.trackIndex);
  }
};

function bind(id, fn) {
  document.getElementById(id).addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    fn(e);
  }, { passive: false });
}

bind('btn-play', () => State.started ? AudioLayer.toggle() : Input.start());
bind('btn-skip', () => Input.skip(1));
bind('btn-color', () => UI.color());
bind('btn-gravity', () => Visual.cycleGravity());
bind('btn-playlist', () => UI.toggleList());
bind('close-playlist', () => UI.toggleList());

document.getElementById('vol-slider').addEventListener('input', e => AudioLayer.setVol(e.target.value));
document.getElementById('vol-slider').addEventListener('pointerdown', e => e.stopPropagation());

const canvas = document.getElementById('renderCanvas');
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!State.started) { Input.start(); return; }
  AudioLayer.ensure();
  Input.pid = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  Visual.registerTouch(e.clientX, e.clientY);
  Cascade.advance(true);
  State.lastCycleAt = performance.now();
}, { passive: false });

canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== Input.pid) return;
  Visual.registerTouch(e.clientX, e.clientY);
}, { passive: true });

canvas.addEventListener('pointerup', (e) => {
  if (e.pointerId === Input.pid) {
    Input.pid = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
  }
}, { passive: true });

canvas.addEventListener('pointercancel', (e) => {
  if (e.pointerId === Input.pid) Input.pid = null;
}, { passive: true });

document.getElementById('hud').addEventListener('pointerdown', (e) => {
  if (e.target.closest('.btn') || e.target.id === 'vol-slider') return;
  e.stopPropagation();
}, { passive: false });

AudioLayer.audio.addEventListener('ended', () => Input.skip(1));
AudioLayer.audio.addEventListener('error', () => Input.skip(1));

/* PWA */
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  State.deferredPrompt = e;
  const b = document.getElementById('install-banner');
  b.style.display = 'block';
  b.addEventListener('pointerdown', async () => {
    b.style.display = 'none';
    if (State.deferredPrompt) {
      State.deferredPrompt.prompt();
      await State.deferredPrompt.userChoice;
      State.deferredPrompt = null;
    }
  }, { once: true, passive: true });
});
window.addEventListener('appinstalled', () => {
  document.getElementById('install-banner').style.display = 'none';
  State.deferredPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
  });
}
</script>
</body>
