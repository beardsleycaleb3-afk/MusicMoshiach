<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    :root { 
      --hue: 30; 
      --frame-color: hsl(var(--hue), 100%, 50%); 
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%); 
    }
    body { 
      margin:0; background:#000; overflow:hidden; touch-action:none; 
      font-family:sans-serif; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      border: 30px solid var(--frame-color);
      box-sizing: border-box; height: 100vh;
    }
    #bg-container, #canvas-container { 
      position:fixed; top:10px; left:10px; 
      width:calc(100vw - 20px); height:calc(100vh - 195px); 
      overflow:hidden; border-bottom: 10px solid var(--frame-color);
    }
    #bg-container { z-index:0; background-size:cover; background-position:center; transition: background-image 1.2s ease-in-out; }
    #canvas-container { z-index:1; pointer-events:none; }
    
    #hud { 
      position:fixed; bottom:0; left:0; width:100%; height:175px; 
      background: #000; display:flex; flex-direction:column; 
      align-items:center; justify-content:space-evenly; z-index:100; padding:5px; box-sizing: border-box;
    }
    #odometer-container { width: 90%; height: 15px; background: #050505; border: 4px solid var(--frame-color); overflow: hidden; }
    #ekg-canvas { width: 100%; height: 100%; filter: drop-shadow(0 0 8px var(--frame-color)); }

    .deck { 
      display:flex; gap:8px; justify-content:center; width: 95%; 
      padding: 10px; border: 8px solid var(--frame-color); box-sizing: border-box;
    }
    .btn { 
      width:44px; height:44px; border:14px solid var(--btn-color); 
      background:#000; color: #fff; display:flex; align-items:center; 
      justify-content:center; cursor: pointer; touch-action: manipulation;
    }
    .btn span { font-size: 22px; pointer-events: none; }

    #vol-slider { width: 55%; height: 20px; appearance: none; background: #222; outline: none; }
    #vol-slider::-webkit-slider-thumb { appearance: none; width: 40px; height: 20px; background: var(--btn-color); }

    #playlist-screen { position: fixed; inset: 0; background: #131; z-index: 200; display: none; flex-direction: column; padding: 10px; overflow-y: auto; touch-action: pan-y; }
    #track-list { -webkit-overflow-scrolling: touch; }
    .track-item { padding: 10px; color: var(--frame-color); border-bottom: 14px solid #222; font-size: 1.5rem; touch-action: manipulation; }
    #track-info { color:var(--frame-color); font-size:1.5rem; font-weight:bold; text-align: center; }
    
    * { border-radius: 50 !important; }
  </style>
</head>
<body onpointerdown="handleInteraction(event)">

<div id="bg-container"></div>
<div id="canvas-container"></div>
<div id="playlist-screen">
    <div style="text-align:right; color:white; font-size:32px; padding: 10px;" onpointerdown="togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
</div>

<div id="hud">
  <div id="track-info">MusicMoshiach</div>
  <div id="mode-label" style="color:var(--frame-color);font-size:1rem;">Mode: liquid</div>
  <div id="odometer-container"><canvas id="ekg-canvas"></canvas></div>
  <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVol(this.value)" onpointerdown="event.stopPropagation()">
  <div class="deck">
    <div class="btn" onpointerdown="toggle(event)"><span>⏯️</span></div>
    <div class="btn" onpointerdown="skip(1, event)"><span>⏭️</span></div>
    <div class="btn" onpointerdown="changeColor(event)"><span>👻</span></div>
    <div class="btn" onpointerdown="cycleVisualMode(event)"><span>🎛️</span></div>
    <div class="btn" onpointerdown="togglePlaylist(event)"><span>🌶️</span></div>
    <div class="btn" onpointerdown="installApp(event)"><span>👾</span></div>
  </div>
</div>

// core images in assets/audio/core (base names without extension)
const coreFiles = ['a','aa','aaa','b','bb','bbb','c','cc','ccc','d','dd','ddd','e','ee','eee','f','ff','fff','g','gg','ggg','h','hh','i','ii','iii','j','jj','jjj','k','kk','kkk','l','ll','lll','m','mm','mmm','n','nn','o','oo','p','pp','q','qq','r','rr','s','ss','t','tt','u','uu','v','vv','w','x','xx','y','yy','z','zz'];

let trackIdx = 0, poolIdx = 0, bgIdx = 0, isStarted = false, currentHue = 30, visualMode = 0;
const visualModes = ['liquid','spiky','ripple','warp','gridfile'];
let audio = new Audio(), audioCtx, analyzer, dataArray;
let scene, camera, renderer, mainSphere, texLoader, minis = [];
let ekgCanvas, ekgCtx, isRoaming = false, velocity = new THREE.Vector3(0,0,0);
const bounds = { x: 3.2, y: 4.2 };
let gridTiles = [], tileIndices = [], activeTile = null, gridSize = 5;

function handleInteraction(e) {
  if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
  if (!isStarted) {
    initThreeJS(); initAudio(); initEKG(); buildPlaylist();
    isStarted = true; loadTrack();
    setInterval(autoCycleVisuals, 5500);
  } else {
    isRoaming = !isRoaming;
    if (isRoaming) velocity.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 0);
    minis.forEach(m => {
      m.userData.dir *= -1;
      m.userData.angleStep *= -1.5; 
    });
    triggerChaos();
  }
}

function autoCycleVisuals() {
  advanceVisualCycle();
}

function advanceVisualCycle() {
  visualMode = (visualMode + 1) % visualModes.length;
  document.getElementById('mode-label').innerText = `Mode: ${visualModes[visualMode]}`;
  bgIdx = (bgIdx + 1) % bgs.length;
  poolIdx = (poolIdx + 1) % coreFiles.length;
  
  // Clear scene for mode transition
  if (visualMode === 4) {
    // Switching to grid mode
    if (mainSphere) scene.remove(mainSphere);
    minis.forEach(m => scene.remove(m));
    minis = [];
    initGridFile();
  } else {
    // Switching from grid to sphere mode
    gridTiles.forEach(tile => scene.remove(tile));
    gridTiles = [];
    if (!mainSphere) {
      const geometry = new THREE.IcosahedronGeometry(1.6, 5);
      const material = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0.82,
        roughness: 0.22,
        metalness: 0.45,
        emissive: new THREE.Color(0x111111),
        side: THREE.DoubleSide,
        map: null
      });
      mainSphere = new THREE.Mesh(geometry, material);
      mainSphere.userData.basePositions = geometry.attributes.position.array.slice();
      scene.add(mainSphere);
    }
  }
  
  triggerChaos();
  applyVisuals();
}

function triggerChaos() {
  bgIdx = Math.floor(Math.random() * bgs.length);
  poolIdx = Math.floor(Math.random() * coreFiles.length);
  applyVisuals();
  
  if (visualMode !== 4) {
    // Sphere chaos
    for (let i = 0; i < 32; i++) spawnMini(mainSphere.position, true);
  } else {
    // Grid chaos - shuffle tiles more aggressively
    shuffleGridImages();
  }
}

function changeColor(e) {
  e.stopPropagation();
  currentHue = (currentHue + 72) % 360;
  document.documentElement.style.setProperty('--hue', currentHue);
}

function cycleVisualMode(e) {
  if (e) e.stopPropagation();
  visualMode = (visualMode + 1) % visualModes.length;
  document.getElementById('mode-label').innerText = `Mode: ${visualModes[visualMode]}`;
  bgIdx = (bgIdx + 1) % bgs.length;
  poolIdx = (poolIdx + 1) % coreFiles.length;
  
  // Clear scene for mode transition
  if (visualMode === 4) {
    // Switching to grid mode
    if (mainSphere) scene.remove(mainSphere);
    minis.forEach(m => scene.remove(m));
    minis = [];
    initGridFile();
  } else {
    // Switching from grid to sphere mode
    gridTiles.forEach(tile => scene.remove(tile));
    gridTiles = [];
    if (!mainSphere) {
      const geometry = new THREE.IcosahedronGeometry(1.6, 5);
      const material = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0.82,
        roughness: 0.22,
        metalness: 0.45,
        emissive: new THREE.Color(0x111111),
        side: THREE.DoubleSide,
        map: null
      });
      mainSphere = new THREE.Mesh(geometry, material);
      mainSphere.userData.basePositions = geometry.attributes.position.array.slice();
      scene.add(mainSphere);
    }
  }
  
  triggerChaos();
  applyVisuals();
}

function initEKG() { 
  ekgCanvas = document.getElementById('ekg-canvas'); 
  ekgCtx = ekgCanvas.getContext('2d'); 
  ekgCanvas.width = ekgCanvas.offsetWidth; 
  ekgCanvas.height = ekgCanvas.offsetHeight; 
}

function drawMirroredWire(intensity) {
  if (!dataArray) return;
  analyzer.getByteFrequencyData(dataArray);
  ekgCtx.clearRect(0, 0, ekgCanvas.width, ekgCanvas.height);
  ekgCtx.beginPath(); 
  ekgCtx.lineWidth = 2 + (intensity * 4);
  ekgCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--frame-color');
  
  const midX = ekgCanvas.width / 2;
  const centerY = ekgCanvas.height / 2;
  const steps = 40; 
  const sliceWidth = midX / steps;

  for (let i = 0; i < steps; i++) {
    const val = (dataArray[i] / 255) * (ekgCanvas.height * (0.8 + intensity));
    const xL = midX - (i * sliceWidth);
    const xR = midX + (i * sliceWidth);
    const jitter = intensity > 0.5 ? (Math.random() - 0.5) * 20 : 0;
    const yTop = centerY - val + jitter;
    
    if (i === 0) { ekgCtx.moveTo(midX, yTop); } 
    else { ekgCtx.lineTo(xL, yTop); ekgCtx.moveTo(xR - sliceWidth, yTop); ekgCtx.lineTo(xR, yTop); }
  }
  ekgCtx.stroke();
}

function spawnMini(sourcePos, isChaos = false) {
  const mini = new THREE.Mesh(new THREE.SphereGeometry(isChaos ? 0.08 : 0.12, 12, 12), new THREE.MeshBasicMaterial({map: mainSphere.material.map, transparent:true, opacity:0.7}));
  const phi = (1 + Math.sqrt(5)) / 2;
  const i = minis.length;
  const lon = 2 * Math.PI * i / Math.pow(phi, 2);
  
  const trailCount = 55;
  const trails = [];
  for(let j=0; j<trailCount; j++) {
    const t = mini.clone();
    t.material = mini.material.clone();
    t.material.opacity = 0.84 - (j * 0.08);
    t.scale.setScalar(1 - (j * 0.25));
    scene.add(t);
    trails.push(t);
  }

  mini.userData = { 
    angle: lon, 
    angleStep: (Math.random() * 0.04) - 0.02,
    radius: 0.1, 
    speed: (Math.random() * 0.02) + 0.01, 
    dir: 1, 
    twinkle: Math.random() * Math.PI,
    trails: trails,
    history: []
  };
  
  scene.add(mini);
  minis.push(mini);
}

function initThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 20) / (window.innerHeight - 205), 0.1, 1000);
  renderer = new THREE.WebGLRenderer({alpha:true, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth - 20, window.innerHeight - 205);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x333333));
  const pointLight = new THREE.PointLight(0xffffff, 1.4, 35);
  pointLight.position.set(5, 6, 5);
  scene.add(pointLight);

  texLoader = new THREE.TextureLoader();
  
  if (visualMode !== 4) {
    // Sphere mode
    const geometry = new THREE.IcosahedronGeometry(1.6, 5);
    const material = new THREE.MeshStandardMaterial({
      transparent: true,
      opacity: 0.82,
      roughness: 0.22,
      metalness: 0.45,
      emissive: new THREE.Color(0x111111),
      side: THREE.DoubleSide,
      map: null
    });
    mainSphere = new THREE.Mesh(geometry, material);
    mainSphere.userData.basePositions = geometry.attributes.position.array.slice();
    scene.add(mainSphere);
  } else {
    // Grid mode
    initGridFile();
  }
  
  camera.position.z = 6;
  applyVisuals();
  animate();
}

function initGridFile() {
  gridTiles = [];
  tileIndices = [];
  
  const tileSize = 0.8;
  const spacing = 0.05;
  const totalSize = gridSize * (tileSize + spacing);
  const startX = -totalSize / 2;
  const startY = -totalSize / 2;
  
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const geometry = new THREE.PlaneGeometry(tileSize, tileSize);
      const material = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: 0.9,
        roughness: 0.3,
        metalness: 0.2,
        side: THREE.DoubleSide,
        map: null
      });
      
      const tile = new THREE.Mesh(geometry, material);
      tile.position.x = startX + x * (tileSize + spacing);
      tile.position.y = startY + y * (tileSize + spacing);
      tile.position.z = 0;
      
      tile.userData = {
        gridX: x,
        gridY: y,
        basePos: tile.position.clone(),
        index: y * gridSize + x,
        isActive: false,
        pullOutTime: 0,
        pullOutDuration: 0,
        targetPos: null
      };
      
      scene.add(tile);
      gridTiles.push(tile);
      tileIndices.push(tile.userData.index);
    }
  }
  
  shuffleGridImages();
}

function shuffleGridImages() {
  // Shuffle the tile index mapping
  for (let i = tileIndices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [tileIndices[i], tileIndices[j]] = [tileIndices[j], tileIndices[i]];
  }
  
  // Apply images to tiles
  for (let i = 0; i < gridTiles.length; i++) {
    const imgIdx = tileIndices[i] % (coreFiles.length + bgs.length);
    if (imgIdx < coreFiles.length) {
      texLoader.load(`assets/audio/core/${coreFiles[imgIdx]}.jpeg`, (texture) => {
        gridTiles[i].material.map = texture;
        gridTiles[i].material.needsUpdate = true;
      });
    } else {
      texLoader.load(`assets/audio/bg/${bgs[imgIdx - coreFiles.length]}.jpg`, (texture) => {
        gridTiles[i].material.map = texture;
        gridTiles[i].material.needsUpdate = true;
      });
    }
  }
}

function updateAudioMesh(intensity) {
  if (!dataArray || !mainSphere || !mainSphere.geometry) return;
  const positions = mainSphere.geometry.attributes.position;
  const normals = mainSphere.geometry.attributes.normal;
  const basePositions = mainSphere.userData.basePositions;
  const time = performance.now() * 0.002;

  let lows = 0, mids = 0, highs = 0;
  for (let i = 0; i < 16; i++) lows += dataArray[i] || 0;
  for (let i = 16; i < 48; i++) mids += dataArray[i] || 0;
  for (let i = 48; i < dataArray.length; i++) highs += dataArray[i] || 0;
  lows /= 16 * 255;
  mids /= 32 * 255;
  highs /= (dataArray.length - 48) * 255;

  for (let i = 0; i < positions.count; i++) {
    const ix = i * 3;
    const baseX = basePositions[ix];
    const baseY = basePositions[ix + 1];
    const baseZ = basePositions[ix + 2];
    const normalX = normals.getX(i);
    const normalY = normals.getY(i);
    const normalZ = normals.getZ(i);
    const radial = Math.sqrt(baseX*baseX + baseY*baseY + baseZ*baseZ);
    const phase = time * 1.3 + i * 0.11;

    let displacement = 0;
    if (visualMode === 0) {
      displacement = (intensity * 0.75 + mids * 0.32 + highs * 0.18) * 0.45;
      displacement += Math.sin(phase) * 0.16;
    } else if (visualMode === 1) {
      displacement = (lows * 0.85 + mids * 0.25) * 0.9;
      displacement += Math.abs(Math.cos(phase * 1.6)) * 0.24;
      displacement += Math.sin(radial * 6 + time * 2.1) * 0.14;
    } else if (visualMode === 2) {
      displacement = Math.sin(radial * 10 - time * 2.2) * 0.22;
      displacement += (mids + highs) * 0.6;
      displacement += Math.cos(phase * 0.9) * 0.1;
    } else {
      displacement = (Math.sin(phase * 1.8) + Math.cos(phase * 2.2)) * 0.12;
      displacement += (lows * 0.5 + highs * 0.6) * 0.55;
      displacement += Math.sin(radial * 12 + time * 1.7) * 0.18;
    }

    positions.setXYZ(
      i,
      baseX + normalX * displacement,
      baseY + normalY * displacement,
      baseZ + normalZ * displacement
    );
  }
  positions.needsUpdate = true;
  mainSphere.geometry.computeVertexNormals();
}

function animate() {
  requestAnimationFrame(animate);
  let intensity = dataArray ? dataArray[1] / 255 : 0; // Bass-focused
  drawMirroredWire(intensity);
  
  if (visualMode !== 4) {
    // Sphere mode
    updateAudioMesh(intensity);

    if (mainSphere) { 
      mainSphere.rotation.y += (0.505 + intensity * 0.15); 
      mainSphere.scale.setScalar(0.25 + intensity * 2.98); // Bass pulse
      mainSphere.material.opacity = 0.68 + (intensity * 0.94);
      
      if (isRoaming) {
        mainSphere.position.add(velocity);
        if (Math.abs(mainSphere.position.x) > bounds.x) velocity.x *= -1;
        if (Math.abs(mainSphere.position.y) > bounds.y) velocity.y *= -1;
      } else { mainSphere.position.lerp(new THREE.Vector3(0,0,0), 0.1); }
    }

    for (let i = minis.length-1; i>=0; i--) {
      let m = minis[i], d = m.userData;
      d.history.unshift(m.position.clone());
      if(d.history.length > 1000) d.history.pop();
      
      // Orbit reacts to bass intensity
      d.radius += (d.speed + (intensity * 0.822)) * d.dir; 
      d.angle += d.angleStep + (intensity * 0.68); 
      
      const tf = (Math.sin(d.twinkle += 0.81) + 1) / 2;
      m.scale.setScalar((0.5 + tf) * (1 + intensity));
      m.material.map = mainSphere.material.map;
      m.material.needsUpdate = true;
      m.position.x = mainSphere.position.x + Math.cos(d.angle) * d.radius;
      m.position.y = mainSphere.position.y + Math.sin(d.angle) * d.radius;

      d.trails.forEach((t, idx) => {
          const hPos = d.history[idx * 2] || m.position;
          t.position.lerp(hPos, 0.2);
          t.material.map = mainSphere.material.map;
          t.material.needsUpdate = true;
          t.scale.setScalar(m.scale.x * (1 - idx * 0.15));
      });

      if (d.radius > 18) d.dir = -1;
      if (d.radius <= 0.02 && d.dir == -1) { d.trails.forEach(t => scene.remove(t)); scene.remove(m); minis.splice(i,1); }
    }
  } else {
    // Grid mode
    updateGridFile(intensity);
  }
  
  renderer.render(scene, camera);
}

function updateGridFile(intensity) {
  // Randomly pull tiles based on intensity
  if (Math.random() < intensity * 0.3) {
    const randomTile = gridTiles[Math.floor(Math.random() * gridTiles.length)];
    if (!randomTile.userData.isActive) {
      randomTile.userData.isActive = true;
      randomTile.userData.pullOutTime = 0;
      randomTile.userData.pullOutDuration = 0.3 + Math.random() * 0.4;
      randomTile.userData.targetPos = new THREE.Vector3(
        (Math.random() - 0.5) * 6,
        (Math.random() - 0.5) * 6,
        2 + Math.random() * 2
      );
    }
  }
  
  // Update active tiles
  for (let tile of gridTiles) {
    if (tile.userData.isActive) {
      tile.userData.pullOutTime += 0.016; // ~60fps
      const progress = Math.min(tile.userData.pullOutTime / tile.userData.pullOutDuration, 1);
      
      // Interpolate position
      const startPos = tile.userData.basePos;
      tile.position.lerpVectors(startPos, tile.userData.targetPos, Math.pow(progress, 1.5));
      
      // Rotate
      tile.rotation.x += intensity * 0.08;
      tile.rotation.y += intensity * 0.12;
      
      // Scale pulse
      tile.scale.setScalar(1 + Math.sin(progress * Math.PI) * 0.2);
      
      // Return to base position
      if (progress >= 1) {
        tile.userData.isActive = false;
        tile.position.copy(tile.userData.basePos);
        tile.rotation.set(0, 0, 0);
        tile.scale.setScalar(1);
      }
    }
  }
}

function loadTrack() { audio.src = `assets/audio/${playlist[trackIdx]}`; document.getElementById('track-info').innerText = songTitles[playlist[trackIdx]] || playlist[trackIdx]; audio.play().catch(()=>{}); }
function skip(n, e) { if(e) e.stopPropagation(); trackIdx = (trackIdx + n + playlist.length) % playlist.length; loadTrack(); }
function applyVisuals() { 
  if (visualMode === 4) {
    // Grid mode - shuffle and reassign images
    shuffleGridImages();
  } else {
    // Sphere mode
    const currentBG = bgs[bgIdx]; 
    const currentCore = coreFiles[poolIdx % coreFiles.length]; 
    document.getElementById('bg-container').style.backgroundImage = `url('assets/audio/bg/${currentBG}.jpg')`; 
    if (mainSphere && texLoader) {
      const texture = texLoader.load(`assets/audio/core/${currentCore}.jpeg`);
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1, 1);
      mainSphere.material.map = texture;
      mainSphere.material.emissive = new THREE.Color(`hsl(${(currentHue + bgIdx * 5) % 360}, 90%, 22%)`);
      mainSphere.material.needsUpdate = true;
    }
  }
}
function toggle(e) { if(e) e.stopPropagation(); audio.paused ? audio.play() : audio.pause(); }
function setVol(v) { audio.volume = v; }
function togglePlaylist(e) { if(e) e.stopPropagation(); const s = document.getElementById('playlist-screen'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; }

function buildPlaylist() { 
    const list = document.getElementById('track-list'); 
    playlist.forEach((track, i) => { 
        const item = document.createElement('div'); 
        item.className = 'track-item'; 
        item.innerText = songTitles[track] || track; 
        // Use pointerdown + pointerup to allow scrolling/drags without accidental selection
        item.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            item._pointerDown = { x: e.clientX, y: e.clientY, time: Date.now() };
        });
        item.addEventListener('pointerup', (e) => {
            e.stopPropagation();
            const pd = item._pointerDown;
            if (!pd) return;
            const dx = Math.abs(e.clientX - pd.x);
            const dy = Math.abs(e.clientY - pd.y);
            const dt = Date.now() - pd.time;
            // if movement was small and quick, treat as a tap/click
            if (dx < 8 && dy < 8 && dt < 600) {
                trackIdx = i; loadTrack(); togglePlaylist();
            }
            item._pointerDown = null;
        });
        item.addEventListener('pointercancel', () => { item._pointerDown = null; });

        list.appendChild(item); 
    }); 
}
function installApp(e) { if(e) e.stopPropagation(); alert("MusicMoshiach"); }

function initAudio() { 
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyzer = audioCtx.createAnalyser();
  analyzer.fftSize = 256;
  try {
    const source = audioCtx.createMediaElementSource(audio);
    source.connect(analyzer);
    analyzer.connect(audioCtx.destination);
    dataArray = new Uint8Array(analyzer.frequencyBinCount);
    audio.crossOrigin = "anonymous";
  } catch(err) {
    // Fallback if media element source cannot be created
    console.warn('Audio initialization failed:', err);
    analyzer = null; dataArray = null;
  }
}

audio.onended = () => skip(1);
audio.addEventListener('error', () => {
  console.warn(`Audio failed to load: ${audio.src}`);
  skip(1);
});

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
