<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    /* LAYER: PRESENTATION */
    :root { --hue: 30; --frame-color: hsl(var(--hue), 100%, 50%); --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%); }
    body { margin:0; background:#000; overflow:hidden; touch-action:none; font-family:sans-serif; border: 30px solid var(--frame-color); box-sizing: border-box; height: 100vh; }
    #bg-container, #canvas-container { position:fixed; top:10px; left:10px; width:calc(100vw - 20px); height:calc(100vh - 195px); overflow:hidden; border-bottom: 10px solid var(--frame-color); }
    #bg-container { z-index:0; background-size:cover; background-position:center; transition: background-image 0.5s ease-in-out; }
    #canvas-container { z-index:1; pointer-events:none; }
    #hud { position:fixed; bottom:0; left:0; width:100%; height:175px; background: #000; display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; z-index:100; padding:5px; box-sizing: border-box; }
    .deck { display:flex; gap:8px; justify-content:center; width: 95%; padding: 10px; border: 8px solid var(--frame-color); box-sizing: border-box; }
    .btn { width:44px; height:44px; border:14px solid var(--btn-color); background:#000; color: #fff; display:flex; align-items:center; justify-content:center; cursor: pointer; touch-action: manipulation; }
    #playlist-screen { position: fixed; inset: 0; background: #131; z-index: 200; display: none; flex-direction: column; padding: 10px; overflow-y: auto; }
    .track-item { padding: 10px; color: var(--frame-color); border-bottom: 14px solid #222; font-size: 1.5rem; }
    #track-info { color:var(--frame-color); font-size:1.5rem; font-weight:bold; text-align: center; }
  </style>
</head>
<body onpointerdown="InputLayer.handle(event)">

<div id="bg-container"></div>
<div id="canvas-container"></div>
<div id="playlist-screen">
    <div style="text-align:right; color:white; font-size:32px; padding: 10px;" onpointerdown="UILayer.togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
</div>

<div id="hud">
  <div id="track-info">MusicMoshiach</div>
  <div class="deck">
    <div class="btn" onpointerdown="AudioLayer.toggle()"><span>⏯️</span></div>
    <div class="btn" onpointerdown="InputLayer.skip(1)"><span>⏭️</span></div>
    <div class="btn" onpointerdown="UILayer.changeColor()"><span>👻</span></div>
    <div class="btn" onpointerdown="SimulationLayer.cycleVisualMode()"><span>🎛️</span></div>
    <div class="btn" onpointerdown="UILayer.togglePlaylist()"><span>🌶️</span></div>
  </div>
</div>

<script>
/* LAYER: DATA/CONTENT
   1. Does: Maintains the registry of truth for song titles and assets.
*/
const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];
const songTitles = {"9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3": "frequencies death","24.mp3": "death frequency 2", "25.mp3": "false star", "26.mp3": "Fifteen Trillion","27.mp3": "fractured shadow", "28.mp3": "FOD", "29.mp3": "FOD 4","30.mp3": "Gods King of Kings", "31.mp3": "Hidden Sultan of Vishnu","32.mp3": "hiss", "33.mp3": "Hook Will NAIL You", "34.mp3": "HOOKED ON THE HISS","35.mp3": "Ignition Arch. X NanoFile","38.mp3": "limit breaks", "39.mp3": "MOON Monster Melody X Comment", "40.mp3": "New one","41.mp3": "no blanking", "42.mp3": "noise swells", "43.mp3": "phantom X Hidden","44.mp3": "phoenix dark", "45.mp3": "planet command", "46.mp3": "Roll over Once","47.mp3": "rust fold", "48.mp3": "ss ii py f", "49.mp3": "ten by seven","50.mp3": "the dark","51.mp3": "the hook", "52.mp3": "THE TRUTH", "53.mp3": "The prophecy","55.mp3": "tuned for death", "56.mp3": "unsteady echo", "57.mp3": "ur decension","58.mp3": "When the curtain moves", "59.mp3": "wildcard subnet", "60.mp3": "yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"};
const coreFiles = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];
const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

/* LAYER: AUDIO ENGINE */
const AudioLayer = {
  audio: new Audio(),
  analyzer: null,
  data: new Uint8Array(64),
  init() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyzer = ctx.createAnalyser();
    this.analyzer.fftSize = 128;
    const source = ctx.createMediaElementSource(this.audio);
    source.connect(this.analyzer);
    this.analyzer.connect(ctx.destination);
  },
  getIntensity() {
    this.analyzer.getByteFrequencyData(this.data);
    return this.data[1] / 255;
  },
  toggle() { this.audio.paused ? this.audio.play() : this.audio.pause(); },
  play(url) { 
    this.audio.src = `assets/audio/${url}`; 
    this.audio.play(); 
    document.getElementById('track-info').innerText = songTitles[url] || url;
  }
};

/* LAYER: SIMULATION/ENGINE */
const SimulationLayer = {
  scene: new THREE.Scene(),
  texCache: {},
  visualMode: 0,
  mainSphere: null,
  texLoader: new THREE.TextureLoader(),
  
  init() {
    this.renderer = new THREE.WebGLRenderer({alpha:true});
    this.renderer.setSize(window.innerWidth-20, window.innerHeight-205);
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);
    this.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
    this.camera.position.z = 6;
    this.mainSphere = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 5), new THREE.MeshStandardMaterial({transparent:true}));
    this.scene.add(this.mainSphere);
    this.loop();
  },
  updateVisuals(idx) {
    const file = coreFiles[idx % coreFiles.length];
    const path = `assets/audio/core/${file}`;
    if (!this.texCache[path]) this.texCache[path] = this.texLoader.load(path);
    this.mainSphere.material.map = this.texCache[path];
    this.mainSphere.material.needsUpdate = true;
    document.getElementById('bg-container').style.backgroundImage = `url('assets/audio/bg/${bgs[idx % bgs.length]}')`;
  },
  cycleVisualMode() { this.visualMode = (this.visualMode + 1) % 5; },
  loop() {
    requestAnimationFrame(() => this.loop());
    const intensity = AudioLayer.getIntensity();
    this.mainSphere.rotation.y += 0.01;
    this.mainSphere.scale.setScalar(0.5 + intensity * 2);
    this.renderer.render(this.scene, this.camera);
  }
};

/* LAYER: UI & INPUT */
const InputLayer = {
  isStarted: false,
  handle(e) {
    if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
    if (!this.isStarted) {
      AudioLayer.init();
      SimulationLayer.init();
      UILayer.buildPlaylist();
      this.isStarted = true;
      AudioLayer.play(playlist[0]);
    }
  },
  skip(n) {
    const current = AudioLayer.audio.src.split('/').pop();
    const idx = (playlist.indexOf(current) + n + playlist.length) % playlist.length;
    AudioLayer.play(playlist[idx]);
    SimulationLayer.updateVisuals(idx);
  }
};

const UILayer = {
  togglePlaylist() { const s = document.getElementById('playlist-screen'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; },
  changeColor() { document.documentElement.style.setProperty('--hue', Math.random()*360); },
  buildPlaylist() {
    const list = document.getElementById('track-list');
    playlist.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerText = songTitles[t] || t;
      item.onclick = () => { AudioLayer.play(t); SimulationLayer.updateVisuals(i); this.togglePlaylist(); };
      list.appendChild(item);
    });
  }
};

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
