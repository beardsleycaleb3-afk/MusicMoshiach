<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    :root {
      --hue: 30;
      --frame-color: hsl(var(--hue), 100%, 50%);
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    body {
      border: 10px solid var(--frame-color);
    }

    #canvas-container {
      position: fixed;
      top: 10px;
      left: 10px;
      width: calc(100vw - 20px);
      height: calc(100vh - 195px);
      overflow: hidden;
      border-bottom: 10px solid var(--frame-color);
      z-index: 1;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 175px;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 5px;
    }

    #track-info {
      color: var(--frame-color);
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }

    #mode-label {
      color: var(--frame-color);
      font-size: 1rem;
      text-align: center;
    }

    #vol-slider {
      width: 55%;
      height: 10px;
      appearance: none;
      background: #222;
      outline: none;
    }

    #vol-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      background: var(--btn-color);
    }

    .deck {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      padding: 10px;
      border: 1px solid var(--frame-color);
    }

    .btn {
      width: 34px;
      height: 44px;
      border: 1px solid var(--btn-color);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn span {
      font-size: 22px;
      pointer-events: none;
    }

    #playlist-screen {
      position: fixed;
      inset: 0;
      background: #131;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    #close-playlist {
      text-align: right;
      color: white;
      font-size: 22px;
      padding: 10px;
      cursor: pointer;
    }

    .track-item {
      padding: 10px;
      color: var(--frame-color);
      border-bottom: 4px solid #222;
      font-size: 1.5rem;
      touch-action: manipulation;
    }
  </style>
</head>
<body onpointerdown="InputLayer.handle(event)">

  <div id="canvas-container"></div>

  <div id="playlist-screen">
    <div id="close-playlist" onpointerdown="UILayer.togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">Layers: 5</div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="AudioLayer.setVolume(this.value)" onpointerdown="event.stopPropagation()">
    <div class="deck">
      <div class="btn" onpointerdown="AudioLayer.toggle(event)"><span>⏯️</span></div>
      <div class="btn" onpointerdown="InputLayer.skip(1, event)"><span>⏭️</span></div>
      <div class="btn" onpointerdown="UILayer.changeColor(event)"><span>👻</span></div>
      <div class="btn" onpointerdown="VisualLayer.cycleGravityMode(event)"><span>🎛️</span></div>
      <div class="btn" onpointerdown="UILayer.togglePlaylist(event)"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {
  started: false,
  trackIndex: 0,
  hue: 30,
  currentBgFile: null,
  lastCycleAt: 0
};

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const songTitles = {
  "9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3":"frequencies death","24.mp3":"death frequency 2","25.mp3":"false star","26.mp3":"Fifteen Trillion","27.mp3":"fractured shadow","28.mp3":"FOD","29.mp3":"FOD 4","30.mp3":"Gods King of Kings","31.mp3":"Hidden Sultan of Vishnu","32.mp3":"hiss","33.mp3":"Hook Will NAIL You","34.mp3":"HOOKED ON THE HISS","35.mp3":"Ignition Arch. X NanoFile","38.mp3":"limit breaks","39.mp3":"MOON Monster Melody X Comment","40.mp3":"New one","41.mp3":"no blanking","42.mp3":"noise swells","43.mp3":"phantom X Hidden","44.mp3":"phoenix dark","45.mp3":"planet command","46.mp3":"Roll over Once","47.mp3":"rust fold","48.mp3":"ss ii py f","49.mp3":"ten by seven","50.mp3":"the dark","51.mp3":"the hook","52.mp3":"THE TRUTH","53.mp3":"The prophecy","55.mp3":"tuned for death","56.mp3":"unsteady echo","57.mp3":"ur decension","58.mp3":"When the curtain moves","59.mp3":"wildcard subnet","60.mp3":"yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"
};

const coreFiles = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];

const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

// ---------------------------------------------------------------------------
// Deque: array wrapped with enqueue-at-back / dequeue-from-front. One deque
// for bg filenames, one for core filenames. Nothing else in this file spawns
// geometry, particles, or overlay effects — this is the entire visual engine:
// a skybox (bg) plus a chain of image-wrapped spheres (core layers).
// ---------------------------------------------------------------------------
function makeDeque(seedList) {
  const items = seedList.slice();
  return {
    items,
    enqueue(value) { this.items.push(value); },
    dequeue() { return this.items.length ? this.items.shift() : null; },
    peekAt(n) { return this.items.length ? this.items[n % this.items.length] : null; }
  };
}

const BgDeque = makeDeque(bgs);
const CoreDeque = makeDeque(coreFiles);

const LAYER_COUNT = 5;
const CYCLE_MS = 10000;
const BEAT_CYCLE_COOLDOWN_MS = 2600; // beat-triggered cycles can't spam faster than this
const PRELOAD_LOOKAHEAD = 3;

// Front layers advance every tick; back layers only advance every Nth tick.
// This is what gives "depth of time" — background feels slow/ambient,
// foreground feels fast/reactive — instead of all 5 layers snapping in lockstep.
const LAYER_STRIDE = [1, 1, 2, 3, 4];

const AssetChain = {
  layerFiles: [],
  tickCount: 0,
  init() {
    for (let i = 0; i < LAYER_COUNT; i++) {
      const seeded = CoreDeque.dequeue();
      this.layerFiles.push(seeded);
      if (seeded) CoreDeque.enqueue(seeded);
    }
    State.currentBgFile = BgDeque.dequeue();
    if (State.currentBgFile) BgDeque.enqueue(State.currentBgFile);
    VisualLayer.applySkybox(State.currentBgFile, true);
    for (let i = 0; i < LAYER_COUNT; i++) VisualLayer.applyLayerTexture(i, this.layerFiles[i], true);
    this.preload();
  },
  cycle() {
    const newBg = BgDeque.dequeue();
    if (!newBg) return;
    BgDeque.enqueue(newBg);

    const enteringCore = State.currentBgFile;
    State.currentBgFile = newBg;
    VisualLayer.applySkybox(newBg);

    this.tickCount++;

    for (let i = 0; i < LAYER_COUNT; i++) {
      if (this.tickCount % LAYER_STRIDE[i] !== 0) continue;
      const incoming = i === 0 ? enteringCore : this.layerFiles[i - 1];
      if (!incoming) continue;
      if (i === LAYER_COUNT - 1 && this.layerFiles[i]) {
        BgDeque.enqueue(this.layerFiles[i]); // oldest falls off the back into the bg pool
      }
      this.layerFiles[i] = incoming;
      VisualLayer.applyLayerTexture(i, incoming);
    }

    this.preload();
  },
  // warm the texture cache for what's coming up next so cycling never stutters
  preload() {
    for (let n = 0; n < PRELOAD_LOOKAHEAD; n++) {
      const bgUp = BgDeque.peekAt(n);
      const coreUp = CoreDeque.peekAt(n);
      if (bgUp) VisualLayer.loadTexture(`assets/audio/bg/${bgUp}`);
      if (coreUp) VisualLayer.loadTexture(`assets/audio/core/${coreUp}`);
    }
  }
};

const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyzer: null,
  data: new Uint8Array(128),
  source: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyzer = this.ctx.createAnalyser();
    this.analyzer.fftSize = 256;
    this.analyzer.smoothingTimeConstant = 0.8;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyzer);
    this.analyzer.connect(this.ctx.destination);
    this.audio.crossOrigin = "anonymous";
    this.audio.volume = 1;
  },
  ensureRunning() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  getBins() {
    if (!this.analyzer) return this.data;
    this.analyzer.getByteFrequencyData(this.data);
    return this.data;
  },
  getIntensity() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 24; i++) sum += bins[i];
    return sum / (24 * 255);
  },
  getBass() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 8; i++) sum += bins[i];
    return sum / (8 * 255);
  },
  lastBeatAt: 0,
  detectBeat() {
    const bass = this.getBass();
    const now = performance.now();
    const hit = bass > 0.45 && now - this.lastBeatAt > 180;
    if (hit) this.lastBeatAt = now;
    return hit ? bass : 0;
  },
  loadTrack(index) {
    State.trackIndex = index;
    this.audio.src = `assets/audio/${playlist[index]}`;
    document.getElementById('track-info').innerText = songTitles[playlist[index]] || playlist[index];
    this.audio.play().catch(() => {});
    this.ensureRunning();
    if (State.started) {
      AssetChain.cycle();
      State.lastCycleAt = performance.now();
    }
  },
  toggle(e) {
    if (e) e.stopPropagation();
    this.audio.paused ? this.audio.play().catch(() => {}) : this.audio.pause();
    this.ensureRunning();
  },
  setVolume(v) {
    this.audio.volume = Number(v);
  }
};

const GRAVITY_MODES = ['fall', 'rise', 'still'];

const VisualLayer = {
  scene: new THREE.Scene(),
  renderer: null,
  camera: null,
  texLoader: new THREE.TextureLoader(),
  textureCache: new Map(),
  skybox: null,
  layers: [],
  gravityMode: 0,
  init() {
    this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(window.innerWidth - 20, window.innerHeight - 205);
    this.renderer.setClearColor(0x000000, 1);
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(55, (window.innerWidth - 20) / (window.innerHeight - 205), 0.1, 1000);
    this.camera.position.z = 6;

    this.scene.add(new THREE.AmbientLight(0x3a3a3a));
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(4, 5, 6);
    this.scene.add(key);

    // Skybox: large inverted sphere, bg image on the inside face
    const skyGeo = new THREE.SphereGeometry(40, 48, 32);
    const skyMat = new THREE.MeshBasicMaterial({ side: THREE.BackSide, transparent: true, opacity: 0.95 });
    this.skybox = new THREE.Mesh(skyGeo, skyMat);
    this.skybox.userData = { fadeAlpha: 1, baseOpacity: 0.95 };
    this.scene.add(this.skybox);

    // Chain of image-wrapped core spheres at different depths/scales/opacity —
    // this IS the parallax: front layer big & opaque, back layers smaller &
    // fainter, each holding an older former-background image.
    for (let i = 0; i < LAYER_COUNT; i++) {
      const depthT = i / (LAYER_COUNT - 1); // 0 = front, 1 = back
      const size = 1.7 - depthT * 0.9;
      const baseOpacity = 0.85 - depthT * 0.55;
      const geo = new THREE.SphereGeometry(size, 48, 32);
      const mat = new THREE.MeshStandardMaterial({
        transparent: true,
        opacity: baseOpacity,
        roughness: 0.3,
        metalness: 0.15,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set((Math.random() - 0.5) * 1.2, (i - LAYER_COUNT / 2) * 0.4, -depthT * 5);
      mesh.userData = {
        depthT,
        baseOpacity,
        fadeAlpha: 1,
        baseY: mesh.position.y,
        baseX: mesh.position.x,
        gravityPhase: Math.random() * Math.PI * 2
      };
      this.scene.add(mesh);
      this.layers.push(mesh);
    }

    this.resize();
    this.loop();
  },
  resize() {
    const w = window.innerWidth - 20;
    const h = window.innerHeight - 205;
    if (this.renderer) this.renderer.setSize(w, h);
    if (this.camera) {
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
    }
  },
  loadTexture(path) {
    if (this.textureCache.has(path)) return this.textureCache.get(path);
    const tex = this.texLoader.load(path);
    tex.colorSpace = THREE.SRGBColorSpace;
    this.textureCache.set(path, tex);
    return tex;
  },
  applySkybox(bgFile, instant) {
    if (!bgFile || !this.skybox) return;
    this.skybox.material.map = this.loadTexture(`assets/audio/bg/${bgFile}`);
    this.skybox.material.needsUpdate = true;
    this.skybox.userData.fadeAlpha = instant ? 1 : 0;
  },
  applyLayerTexture(layerIndex, coreFile, instant) {
    if (!coreFile) return;
    const mesh = this.layers[layerIndex];
    if (!mesh) return;
    mesh.material.map = this.loadTexture(`assets/audio/core/${coreFile}`);
    mesh.material.needsUpdate = true;
    mesh.userData.fadeAlpha = instant ? 1 : 0;
  },
  cycleGravityMode(e) {
    if (e) e.stopPropagation();
    this.gravityMode = (this.gravityMode + 1) % GRAVITY_MODES.length;
    document.getElementById('mode-label').innerText = `Layers: ${LAYER_COUNT} / Gravity: ${GRAVITY_MODES[this.gravityMode]}`;
  },
  updateLayers(intensity, bass) {
    const now = performance.now() * 0.001;
    const mode = GRAVITY_MODES[this.gravityMode];

    for (let i = 0; i < this.layers.length; i++) {
      const mesh = this.layers[i];
      const d = mesh.userData;

      // vertical gravity drift, speed scaled by depth for parallax feel
      const speed = 0.15 + d.depthT * 0.1;
      if (mode === 'fall') {
        mesh.position.y -= speed * 0.01;
        if (mesh.position.y < -3) mesh.position.y = 3;
      } else if (mode === 'rise') {
        mesh.position.y += speed * 0.01;
        if (mesh.position.y > 3) mesh.position.y = -3;
      } else {
        mesh.position.y = d.baseY + Math.sin(now * 0.4 + d.gravityPhase) * 0.25;
      }

      // slow horizontal parallax sway, back layers sway slower/less
      mesh.position.x = d.baseX + Math.sin(now * (0.2 + d.depthT * 0.15) + d.gravityPhase) * (0.4 - d.depthT * 0.2);

      // shape/scale reacts to audio so it still "changes shape" without facet distortion
      const pulse = 1 + intensity * 0.35 + bass * 0.25 * (1 - d.depthT * 0.5);
      mesh.scale.setScalar(pulse);

      mesh.rotation.y += 0.002 + intensity * 0.004;
      mesh.rotation.x += 0.0012;

      // crossfade: ramp opacity in from 0 whenever a fresh texture just landed
      d.fadeAlpha = Math.min(1, d.fadeAlpha + 0.045);
      mesh.material.opacity = d.baseOpacity * d.fadeAlpha;
    }

    this.skybox.rotation.y += 0.0002 + intensity * 0.0002;
    this.skybox.userData.fadeAlpha = Math.min(1, this.skybox.userData.fadeAlpha + 0.03);
    this.skybox.material.opacity = this.skybox.userData.baseOpacity * this.skybox.userData.fadeAlpha;

    // touch-position camera drift: last tap's x/y gently pulls the camera,
    // decaying back to center so touch feels spatial, not just a trigger
    this.touchDrift.x += (this.touchTarget.x - this.touchDrift.x) * 0.04;
    this.touchDrift.y += (this.touchTarget.y - this.touchDrift.y) * 0.04;
    this.camera.position.x += this.touchDrift.x * 0.6;
    this.camera.position.y += this.touchDrift.y * 0.4;
    this.camera.lookAt(0, 0, 0);
  },
  touchTarget: { x: 0, y: 0 },
  touchDrift: { x: 0, y: 0 },
  registerTouch(event) {
    const rect = document.body.getBoundingClientRect();
    const xNorm = (event.clientX / rect.width) * 2 - 1;   // -1..1
    const yNorm = -((event.clientY / rect.height) * 2 - 1);
    this.touchTarget = { x: xNorm * 0.8, y: yNorm * 0.5 };
  },
  lastBeatCycleAt: 0,
  loop() {
    requestAnimationFrame(() => this.loop());

    const intensity = AudioLayer.getIntensity();
    const bass = AudioLayer.getBass();
    const beatHit = AudioLayer.detectBeat();
    const now = performance.now();

    if (now - State.lastCycleAt > CYCLE_MS) {
      AssetChain.cycle();
      State.lastCycleAt = now;
    } else if (beatHit > 0 && now - this.lastBeatCycleAt > BEAT_CYCLE_COOLDOWN_MS) {
      // a hard bass hit can also drive the chain forward, not just tap/timer
      AssetChain.cycle();
      this.lastBeatCycleAt = now;
      State.lastCycleAt = now;
    }

    this.updateLayers(intensity, bass);
    this.renderer.render(this.scene, this.camera);
  }
};

const UILayer = {
  togglePlaylist(e) {
    if (e) e.stopPropagation();
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  changeColor(e) {
    if (e) e.stopPropagation();
    State.hue = (State.hue + 22) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildPlaylist() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerText = songTitles[t] || t;
      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.loadTrack(i);
        this.togglePlaylist();
      });
      list.appendChild(item);
    });
  }
};

const InputLayer = {
  handle(e) {
    if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
    if (!State.started) {
      AudioLayer.init();
      VisualLayer.init();
      AssetChain.init();
      UILayer.buildPlaylist();
      State.started = true;
      State.lastCycleAt = performance.now();
      AudioLayer.loadTrack(0);
    } else {
      AudioLayer.ensureRunning();
      AssetChain.cycle();
      State.lastCycleAt = performance.now();
      VisualLayer.registerTouch(e);
    }
  },
  skip(n, e) {
    if (e) e.stopPropagation();
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.loadTrack(State.trackIndex);
  }
};

AudioLayer.audio.onended = () => InputLayer.skip(1);
AudioLayer.audio.addEventListener('error', () => InputLayer.skip(1));
window.addEventListener('resize', () => VisualLayer.resize());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
