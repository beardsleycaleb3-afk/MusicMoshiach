<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#ff7a00">
  <meta name="color-scheme" content="dark">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    :root {
      --hue: 30;
      --frame: hsl(var(--hue), 100%, 50%);
      --btn: hsl(calc(var(--hue) + 180), 100%, 50%);
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }
    html, body {
      margin: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    body {
      width: 100dvw;
      height: 100dvh;
      border: 5px solid var(--frame);
      position: relative;
    }
    /* Full-bleed static background image – resized to fit entire image in dvh/dvw */
    #bg-layer {
      position: absolute;
      top: 5px; left: 5px;
      width: calc(100dvw - 10px);
      height: calc(100dvh - 148px);
      z-index: 0;
      background: #000 center / contain no-repeat;
      pointer-events: none;
    }
    #renderCanvas {
      position: absolute;
      top: 5px; left: 5px;
      width: calc(100dvw - 10px);
      height: calc(100dvh - 148px);
      outline: none;
      touch-action: none;
      z-index: 1;
      background: transparent;
      display: block;
    }
    #hud {
      position: absolute;
      left: 0; bottom: 0;
      width: 100%; height: 143px;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 3px 5px 6px;
    }
    #track-info {
      color: var(--frame);
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 94%;
    }
    #mode-label {
      color: var(--frame);
      font-size: 0.68rem;
      text-align: center;
    }
    #vol-slider {
      width: 74%;
      height: 11px;
      appearance: none;
      background: #222;
      outline: none;
      border-radius: 6px;
    }
    #vol-slider::-webkit-slider-thumb {
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: var(--btn);
    }
    .deck {
      display: flex;
      gap: 5px;
      justify-content: center;
      width: 96%;
      padding: 5px;
      border: 1px solid var(--frame);
    }
    .btn {
      width: 40px; height: 44px;
      border: 1px solid var(--btn);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn span { font-size: 19px; pointer-events: none; }
    #playlist-screen {
      position: absolute;
      inset: 0;
      background: #0c140c;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 6px;
      overflow-y: auto;
      touch-action: pan-y;
    }
    #close-playlist {
      text-align: right;
      color: #fff;
      font-size: 22px;
      padding: 6px 10px;
      touch-action: manipulation;
    }
    .track-item {
      padding: 11px 7px;
      color: var(--frame);
      border-bottom: 2px solid #222;
      font-size: 1.05rem;
      touch-action: manipulation;
    }
    #install-banner {
      display: none;
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      background: #111;
      border: 2px solid var(--frame);
      color: var(--frame);
      padding: 9px 14px;
      font-size: 0.82rem;
      text-align: center;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <!-- Static full-image background – entire image visible, fitted to dvh/dvw -->
  <div id="bg-layer"></div>
  <canvas id="renderCanvas"></canvas>
  <div id="install-banner">Tap to install MusicMoshiach</div>

  <div id="playlist-screen">
    <div id="close-playlist">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">BPM: -- | Gravity: still</div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
    <div class="deck">
      <div class="btn" id="btn-play" role="button"><span>⏯️</span></div>
      <div class="btn" id="btn-skip" role="button"><span>⏭️</span></div>
      <div class="btn" id="btn-color" role="button"><span>👻</span></div>
      <div class="btn" id="btn-gravity" role="button"><span>🎛️</span></div>
      <div class="btn" id="btn-playlist" role="button"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {
  started: false,
  trackIndex: 0,
  hue: 30,
  currentBg: null,
  lastCycleAt: 0,
  estimatedBpm: 0,
  deferredPrompt: null,
  // per-song personality (derived from track)
  songSeed: 0,
  songEnergy: 0.5,
  songChaos: 0.5
};

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const songTitles = {
  "9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3":"frequencies death","24.mp3":"death frequency 2","25.mp3":"false star","26.mp3":"Fifteen Trillion","27.mp3":"fractured shadow","28.mp3":"FOD","29.mp3":"FOD 4","30.mp3":"Gods King of Kings","31.mp3":"Hidden Sultan of Vishnu","32.mp3":"hiss","33.mp3":"Hook Will NAIL You","34.mp3":"HOOKED ON THE HISS","35.mp3":"Ignition Arch. X NanoFile","38.mp3":"limit breaks","39.mp3":"MOON Monster Melody X Comment","40.mp3":"New one","41.mp3":"no blanking","42.mp3":"noise swells","43.mp3":"phantom X Hidden","44.mp3":"phoenix dark","45.mp3":"planet command","46.mp3":"Roll over Once","47.mp3":"rust fold","48.mp3":"ss ii py f","49.mp3":"ten by seven","50.mp3":"the dark","51.mp3":"the hook","52.mp3":"THE TRUTH","53.mp3":"The prophecy","55.mp3":"tuned for death","56.mp3":"unsteady echo","57.mp3":"ur decension","58.mp3":"When the curtain moves","59.mp3":"wildcard subnet","60.mp3":"yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"
};

/* All images – BGs + cores – one rotating pool for the spheres.
   Background uses only true BG images so the static layer always looks correct. */
const BG_ONLY = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg',
  '11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg',
  '21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg',
  '31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg',
  '42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg',
  '52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg',
  '64.jpg','65.jpg'].map(function(f) { return { file: f, folder: 'bg' }; });

const CORE_ONLY = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg',
  'd.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg',
  'g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg',
  'jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg',
  'mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg',
  'qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg',
  'v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg']
  .map(function(f) { return { file: f, folder: 'core' }; });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function makeDeque(list) {
  const items = shuffle(list);
  return {
    items: items,
    enqueue: function(v) { if (v) this.items.push(v); },
    dequeue: function() { return this.items.length ? this.items.shift() : null; },
    peekAt: function(n) { return this.items.length ? this.items[n % this.items.length] : null; }
  };
}

const BgPool = makeDeque(BG_ONLY);
const CorePool = makeDeque(CORE_ONLY);

const SPHERE_COUNT = 3;
const CYCLE_MS = 9000;
const BEAT_COOLDOWN = 2100;
const GRAVITY_MODES = ['fall', 'rise', 'still', 'orbit'];

/* ── Audio: the song is the parser ── */
const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyser: null,
  data: new Uint8Array(128),
  source: null,
  lastBeatAt: 0,
  intervals: [],
  // rolling spectral character of the current song
  avgBass: 0,
  avgMid: 0,
  avgHigh: 0,
  peakBass: 0,

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.65;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
    this.audio.crossOrigin = 'anonymous';
    this.audio.volume = 1;
  },
  ensure() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  bins() {
    if (!this.analyser) return this.data;
    this.analyser.getByteFrequencyData(this.data);
    return this.data;
  },
  // Live band energy – this is what makes each moment unique
  parse() {
    const b = this.bins();
    let bass = 0, mid = 0, high = 0;
    for (let i = 0; i < 8; i++) bass += b[i];
    for (let i = 8; i < 40; i++) mid += b[i];
    for (let i = 40; i < 128; i++) high += b[i];
    bass /= (8 * 255);
    mid /= (32 * 255);
    high /= (88 * 255);

    // smooth toward song character
    this.avgBass = this.avgBass * 0.92 + bass * 0.08;
    this.avgMid = this.avgMid * 0.92 + mid * 0.08;
    this.avgHigh = this.avgHigh * 0.92 + high * 0.08;
    this.peakBass = Math.max(this.peakBass * 0.98, bass);

    return { bass: bass, mid: mid, high: high, intensity: (bass * 0.5 + mid * 0.35 + high * 0.15) };
  },
  detectBeat() {
    const p = this.parse();
    const now = performance.now();
    if (p.bass > 0.45 && now - this.lastBeatAt > 140) {
      if (this.lastBeatAt > 0) {
        this.intervals.push(now - this.lastBeatAt);
        if (this.intervals.length > 12) this.intervals.shift();
        const sorted = this.intervals.slice().sort(function(a, b) { return a - b; });
        State.estimatedBpm = Math.round(60000 / sorted[Math.floor(sorted.length / 2)]);
      }
      this.lastBeatAt = now;
      return p.bass;
    }
    return 0;
  },
  // Seed unique personality from the track itself
  fingerprint(index) {
    const name = playlist[index] || '';
    let h = 0;
    for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
    State.songSeed = Math.abs(h) % 1000;
    // different tracks get different base motion profiles
    State.songEnergy = 0.3 + (State.songSeed % 70) / 100;
    State.songChaos = 0.2 + ((State.songSeed * 7) % 80) / 100;
    this.avgBass = 0; this.avgMid = 0; this.avgHigh = 0; this.peakBass = 0;
  },
  load(i) {
    State.trackIndex = i;
    this.fingerprint(i);
    this.audio.src = 'assets/audio/' + playlist[i];
    document.getElementById('track-info').textContent = songTitles[playlist[i]] || playlist[i];
    this.audio.play().catch(function(){});
    this.ensure();
    this.intervals = [];
    if (State.started) {
      Cascade.advance();
      State.lastCycleAt = performance.now();
    }
  },
  toggle() {
    this.audio.paused ? this.audio.play().catch(function(){}) : this.audio.pause();
    this.ensure();
  },
  setVol(v) { this.audio.volume = +v; }
};

/* ── Cascade ──
   Static BG: only real background images, fitted with CSS contain (full image visible).
   Spheres: always wrapped with cores (and can receive former BGs if desired).
*/
const Cascade = {
  slots: [null, null, null],
  init() {
    State.currentBg = BgPool.dequeue();
    for (let i = 0; i < SPHERE_COUNT; i++) {
      this.slots[i] = CorePool.dequeue();
    }
    Visual.applySky(State.currentBg);
    for (let i = 0; i < SPHERE_COUNT; i++) {
      Visual.applySphere(i, this.slots[i]);
    }
    this.preload();
  },
  advance() {
    // BG stays static visually but we still cycle which full image is shown
    if (State.currentBg) BgPool.enqueue(State.currentBg);
    State.currentBg = BgPool.dequeue();
    if (!State.currentBg) State.currentBg = BgPool.dequeue();

    // spheres keep cycling cores (and can take a bg occasionally for variety)
    if (this.slots[2]) CorePool.enqueue(this.slots[2]);
    this.slots[2] = this.slots[1];
    this.slots[1] = this.slots[0];
    this.slots[0] = CorePool.dequeue() || BgPool.peekAt(0);

    Visual.applySky(State.currentBg);
    for (let i = 0; i < SPHERE_COUNT; i++) {
      Visual.applySphere(i, this.slots[i]);
    }
    this.preload();
  },
  preload() {
    for (let n = 0; n < 4; n++) {
      const b = BgPool.peekAt(n);
      const c = CorePool.peekAt(n);
      if (b) Visual.preload(b);
      if (c) Visual.preload(c);
    }
  }
};

/* ── Babylon: transparent canvas over static full-fit BG ── */
const Visual = {
  engine: null,
  scene: null,
  camera: null,
  spheres: [],
  gravity: 0,
  touch: { x: 0, y: 0 },
  lastBeatCycle: 0,
  cache: new Map(),
  bgEl: null,

  init() {
    this.bgEl = document.getElementById('bg-layer');
    const canvas = document.getElementById('renderCanvas');

    this.engine = new BABYLON.Engine(canvas, true, {
      preserveDrawingBuffer: true,
      stencil: true,
      adaptToDeviceRatio: true,
      alpha: true
    });
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    this.engine.setHardwareScalingLevel(1 / dpr);

    this.scene = new BABYLON.Scene(this.engine);
    // transparent so the static CSS background shows through
    this.scene.clearColor = new BABYLON.Color4(0, 0, 0, 0);

    this.camera = new BABYLON.ArcRotateCamera(
      'cam', -Math.PI / 2, Math.PI / 2.2, 13, BABYLON.Vector3.Zero(), this.scene
    );
    this.camera.lowerRadiusLimit = 5;
    this.camera.upperRadiusLimit = 24;
    this.camera.panningSensibility = 0;
    this.camera.attachControl(canvas, false);

    const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0.15, 1, 0.25), this.scene);
    hemi.intensity = 0.55;
    const pt = new BABYLON.PointLight('p', new BABYLON.Vector3(0, 4, 5), this.scene);
    pt.intensity = 0.4;

    // Three spheres only – different sizes, always image-wrapped
    const sizes = [4.0, 2.6, 1.5];
    const offsets = [
      new BABYLON.Vector3(0, 0.2, 0),
      new BABYLON.Vector3(3.6, 1.0, -1.2),
      new BABYLON.Vector3(-3.0, -1.1, 1.8)
    ];

    for (let i = 0; i < SPHERE_COUNT; i++) {
      const mesh = BABYLON.MeshBuilder.CreateSphere('s' + i, {
        diameter: sizes[i],
        segments: 32
      }, this.scene);

      const mat = new BABYLON.StandardMaterial('m' + i, this.scene);
      mat.diffuseColor = BABYLON.Color3.White();
      mat.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
      mat.specularColor = new BABYLON.Color3(0.06, 0.06, 0.06);
      mesh.material = mat;
      mesh.position = offsets[i].clone();

      this.spheres.push({
        mesh: mesh,
        mat: mat,
        base: offsets[i].clone(),
        phase: Math.random() * Math.PI * 2,
        spin: new BABYLON.Vector3(
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.025,
          (Math.random() - 0.5) * 0.012
        )
      });
    }

    const self = this;
    this.engine.runRenderLoop(function() { self.tick(); });
    window.addEventListener('resize', function() { self.engine.resize(); });
  },

  url(item) {
    if (!item) return null;
    return 'assets/audio/' + item.folder + '/' + item.file;
  },

  preload(item) {
    const u = this.url(item);
    if (!u || this.cache.has(u)) return this.cache.get(u);
    const tex = new BABYLON.Texture(u, this.scene, false, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
    tex.wrapU = BABYLON.Texture.CLAMP_ADDRESSMODE;
    tex.wrapV = BABYLON.Texture.CLAMP_ADDRESSMODE;
    tex.uScale = 1;
    tex.vScale = 1;
    this.cache.set(u, tex);
    return tex;
  },

  /* Static background: CSS contain = entire image visible, fitted to the panel */
  applySky(item) {
    if (!item || !this.bgEl) return;
    const u = this.url(item);
    this.bgEl.style.backgroundImage = 'url("' + u + '")';
    this.bgEl.style.backgroundSize = 'contain';   // full image visible, no crop zoom
    this.bgEl.style.backgroundPosition = 'center';
    this.bgEl.style.backgroundRepeat = 'no-repeat';
  },

  applySphere(index, item) {
    if (!item || !this.spheres[index]) return;
    const tex = this.preload(item);
    tex.uScale = 1;
    tex.vScale = 1;
    const mat = this.spheres[index].mat;
    mat.diffuseTexture = tex;
    mat.emissiveTexture = tex;
    mat.emissiveColor = new BABYLON.Color3(0.35, 0.35, 0.35);
    mat.diffuseColor = BABYLON.Color3.White();
  },

  cycleGravity() {
    this.gravity = (this.gravity + 1) % GRAVITY_MODES.length;
    this.label();
  },

  label() {
    const bpm = State.estimatedBpm > 40 ? State.estimatedBpm : '--';
    document.getElementById('mode-label').textContent =
      'BPM: ' + bpm + ' | Gravity: ' + GRAVITY_MODES[this.gravity];
  },

  registerTouch(x, y) {
    const r = this.engine.getRenderingCanvas().getBoundingClientRect();
    this.touch = {
      x: ((x - r.left) / r.width) * 2 - 1,
      y: -(((y - r.top) / r.height) * 2 - 1)
    };
  },

  tick() {
    if (!this.scene) return;

    const p = AudioLayer.parse();          // live song analysis
    const beat = AudioLayer.detectBeat();
    const now = performance.now();
    const t = now * 0.001;

    // cascade on time or strong beat
    if (now - State.lastCycleAt > CYCLE_MS) {
      Cascade.advance();
      State.lastCycleAt = now;
    } else if (beat > 0 && now - this.lastBeatCycle > BEAT_COOLDOWN) {
      Cascade.advance();
      this.lastBeatCycle = now;
      State.lastCycleAt = now;
    }

    if (Math.floor(t * 2) % 2 === 0) this.label();

    // touch steers camera
    this.camera.alpha += this.touch.x * 0.015;
    this.camera.beta = BABYLON.Scalar.Clamp(
      this.camera.beta - this.touch.y * 0.012,
      0.28, Math.PI - 0.28
    );

    const mode = GRAVITY_MODES[this.gravity];
    const energy = State.songEnergy;
    const chaos = State.songChaos;
    const seed = State.songSeed * 0.001;

    // Each sphere reacts to different bands so the song “renders” itself
    for (let i = 0; i < this.spheres.length; i++) {
      const s = this.spheres[i];
      const mesh = s.mesh;
      const mat = s.mat;
      const base = s.base;
      const phase = s.phase + seed * (i + 1);
      const spin = s.spin;

      // band assignment: large=bass, mid=mids, small=highs
      const band = i === 0 ? p.bass : (i === 1 ? p.mid : p.high);
      const drive = band * energy + p.intensity * 0.3;

      // rotation driven by the music
      mesh.rotation.x += spin.x * (1 + drive * 3.2 + chaos * 0.8);
      mesh.rotation.y += spin.y * (1 + drive * 2.6 + p.mid * 1.5);
      mesh.rotation.z += spin.z * (1 + p.bass * 1.8);

      // scale = the song breathing through the sphere
      const pulse = 1 + drive * 0.45 + (i === 0 ? p.bass * 0.35 : p.high * 0.25);
      mesh.scaling.setAll(pulse);

      // position motion unique to the track’s energy/chaos
      let x = Math.cos(t * (0.35 + chaos * 0.4) + phase) * (0.8 + drive * 1.2);
      let y = Math.sin(t * (0.45 + energy * 0.3) + phase) * (0.7 + drive * 0.9);
      let z = Math.sin(t * (0.4 + chaos * 0.25) + phase * 1.2) * (0.6 + drive * 0.7);

      if (mode === 'fall') y -= ((t * (0.25 + energy * 0.2) + i) % 4.2) - 2.1;
      if (mode === 'rise') y += ((t * (0.25 + energy * 0.2) + i) % 4.2) - 2.1;
      if (mode === 'orbit') {
        const a = t * (0.3 + energy * 0.25) + i * 2.1 + seed;
        x = Math.cos(a) * (3.4 - i * 0.7 + drive);
        z = Math.sin(a) * (3.4 - i * 0.7 + drive);
        y = Math.sin(a * 1.3) * (1.1 + p.mid);
      }

      mesh.position.x = base.x + x;
      mesh.position.y = base.y + y;
      mesh.position.z = base.z + z;

      // emissive glow follows the band so the wrapped image lights with the music
      const g = 0.28 + band * 0.65 + p.intensity * 0.2;
      mat.emissiveColor.set(g, g * (0.85 + p.high * 0.15), g * (0.75 + p.mid * 0.2));
    }

    this.scene.render();
  }
};

/* ── UI ── */
const UI = {
  toggleList() {
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  color() {
    State.hue = (State.hue + 24) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildList() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach(function(t, i) {
      const el = document.createElement('div');
      el.className = 'track-item';
      el.textContent = songTitles[t] || t;
      el.addEventListener('pointerdown', function(e) {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.load(i);
        UI.toggleList();
      }, { passive: false });
      list.appendChild(el);
    });
  }
};

const Input = {
  pid: null,
  start() {
    if (State.started) return;
    AudioLayer.init();
    Visual.init();
    Cascade.init();
    UI.buildList();
    State.started = true;
    State.lastCycleAt = performance.now();
    AudioLayer.load(0);
  },
  skip(n) {
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.load(State.trackIndex);
  }
};

function bind(id, fn) {
  document.getElementById(id).addEventListener('pointerdown', function(e) {
    e.stopPropagation();
    e.preventDefault();
    fn(e);
  }, { passive: false });
}

bind('btn-play', function() { State.started ? AudioLayer.toggle() : Input.start(); });
bind('btn-skip', function() { Input.skip(1); });
bind('btn-color', function() { UI.color(); });
bind('btn-gravity', function() { Visual.cycleGravity(); });
bind('btn-playlist', function() { UI.toggleList(); });
bind('close-playlist', function() { UI.toggleList(); });

document.getElementById('vol-slider').addEventListener('input', function(e) { AudioLayer.setVol(e.target.value); });
document.getElementById('vol-slider').addEventListener('pointerdown', function(e) { e.stopPropagation(); });

const canvas = document.getElementById('renderCanvas');
canvas.addEventListener('pointerdown', function(e) {
  e.preventDefault();
  if (!State.started) { Input.start(); return; }
  AudioLayer.ensure();
  Input.pid = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  Visual.registerTouch(e.clientX, e.clientY);
  Cascade.advance();
  State.lastCycleAt = performance.now();
}, { passive: false });

canvas.addEventListener('pointermove', function(e) {
  if (e.pointerId !== Input.pid) return;
  Visual.registerTouch(e.clientX, e.clientY);
}, { passive: true });

canvas.addEventListener('pointerup', function(e) {
  if (e.pointerId === Input.pid) {
    Input.pid = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
}, { passive: true });

canvas.addEventListener('pointercancel', function(e) {
  if (e.pointerId === Input.pid) Input.pid = null;
}, { passive: true });

document.getElementById('hud').addEventListener('pointerdown', function(e) {
  if (e.target.closest('.btn') || e.target.id === 'vol-slider') return;
  e.stopPropagation();
}, { passive: false });

AudioLayer.audio.addEventListener('ended', function() { Input.skip(1); });
AudioLayer.audio.addEventListener('error', function() { Input.skip(1); });

window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  State.deferredPrompt = e;
  const b = document.getElementById('install-banner');
  b.style.display = 'block';
  b.addEventListener('pointerdown', async function() {
    b.style.display = 'none';
    if (State.deferredPrompt) {
      State.deferredPrompt.prompt();
      await State.deferredPrompt.userChoice;
      State.deferredPrompt = null;
    }
  }, { once: true, passive: true });
});
window.addEventListener('appinstalled', function() {
  document.getElementById('install-banner').style.display = 'none';
  State.deferredPrompt = null;
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(){});
  });
}
</script>
</body>
