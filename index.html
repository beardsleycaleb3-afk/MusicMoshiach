<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --hue: 30;
      --frame-color: hsl(var(--hue), 100%, 50%);
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    body {
      border: 10px solid var(--frame-color);
    }

    #canvas-container {
      position: fixed;
      top: 10px;
      left: 10px;
      width: calc(100vw - 20px);
      height: calc(100vh - 195px);
      overflow: hidden;
      border-bottom: 10px solid var(--frame-color);
      z-index: 1;
      pointer-events: none;
      background: #000;
    }

    .layer-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #bg-canvas {
      z-index: 1;
    }

    #mid-canvas {
      z-index: 2;
    }

    #fg-canvas {
      z-index: 3;
    }

    #hud {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 175px;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 5px;
    }

    #track-info {
      color: var(--frame-color);
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }

    #mode-label {
      color: var(--frame-color);
      font-size: 1rem;
      text-align: center;
    }

    #vol-slider {
      width: 55%;
      height: 10px;
      appearance: none;
      background: #222;
      outline: none;
    }

    #vol-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      background: var(--btn-color);
    }

    .deck {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      padding: 10px;
      border: 1px solid var(--frame-color);
    }

    .btn {
      width: 34px;
      height: 44px;
      border: 1px solid var(--btn-color);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn span {
      font-size: 22px;
      pointer-events: none;
    }

    #playlist-screen {
      position: fixed;
      inset: 0;
      background: #131;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    #close-playlist {
      text-align: right;
      color: white;
      font-size: 22px;
      padding: 10px;
      cursor: pointer;
    }

    .track-item {
      padding: 10px;
      color: var(--frame-color);
      border-bottom: 4px solid #222;
      font-size: 1.5rem;
      touch-action: manipulation;
    }
  </style>
</head>
<body onpointerdown="InputLayer.handle(event)">

  <div id="canvas-container">
    <canvas id="bg-canvas" class="layer-canvas"></canvas>
    <canvas id="mid-canvas" class="layer-canvas"></canvas>
    <canvas id="fg-canvas" class="layer-canvas"></canvas>
  </div>

  <div id="playlist-screen">
    <div id="close-playlist" onpointerdown="UILayer.togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">Layers: 5</div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="AudioLayer.setVolume(this.value)" onpointerdown="event.stopPropagation()">
    <div class="deck">
      <div class="btn" onpointerdown="AudioLayer.toggle(event)"><span>⏯️</span></div>
      <div class="btn" onpointerdown="InputLayer.skip(1, event)"><span>⏭️</span></div>
      <div class="btn" onpointerdown="UILayer.changeColor(event)"><span>👻</span></div>
      <div class="btn" onpointerdown="VisualLayer.cycleGravityMode(event)"><span>🎛️</span></div>
      <div class="btn" onpointerdown="UILayer.togglePlaylist(event)"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {
  started: false,
  trackIndex: 0,
  hue: 30,
  currentBgFile: null,
  lastCycleAt: 0
};

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const songTitles = {
  "9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3":"frequencies death","24.mp3":"death frequency 2","25.mp3":"false star","26.mp3":"Fifteen Trillion","27.mp3":"fractured shadow","28.mp3":"FOD","29.mp3":"FOD 4","30.mp3":"Gods King of Kings","31.mp3":"Hidden Sultan of Vishnu","32.mp3":"hiss","33.mp3":"Hook Will NAIL You","34.mp3":"HOOKED ON THE HISS","35.mp3":"Ignition Arch. X NanoFile","38.mp3":"limit breaks","39.mp3":"MOON Monster Melody X Comment","40.mp3":"New one","41.mp3":"no blanking","42.mp3":"noise swells","43.mp3":"phantom X Hidden","44.mp3":"phoenix dark","45.mp3":"planet command","46.mp3":"Roll over Once","47.mp3":"rust fold","48.mp3":"ss ii py f","49.mp3":"ten by seven","50.mp3":"the dark","51.mp3":"the hook","52.mp3":"THE TRUTH","53.mp3":"The prophecy","55.mp3":"tuned for death","56.mp3":"unsteady echo","57.mp3":"ur decension","58.mp3":"When the curtain moves","59.mp3":"wildcard subnet","60.mp3":"yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"
};

const coreFiles = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];

const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

function makeDeque(seedList) {
  const items = seedList.slice();
  return {
    items,
    enqueue(value) { this.items.push(value); },
    dequeue() { return this.items.length ? this.items.shift() : null; },
    peekAt(n) { return this.items.length ? this.items[n % this.items.length] : null; }
  };
}

const BgDeque = makeDeque(bgs);
const CoreDeque = makeDeque(coreFiles);

const LAYER_COUNT = 5;
const CYCLE_MS = 10000;
const BEAT_CYCLE_COOLDOWN_MS = 2600;
const PRELOAD_LOOKAHEAD = 3;
const LAYER_STRIDE = [1, 1, 2, 3, 4];

const ImageStore = {
  cache: new Map(),
  load(path) {
    if (this.cache.has(path)) return this.cache.get(path);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.src = path;
    this.cache.set(path, img);
    return img;
  }
};

const AssetChain = {
  layerFiles: [],
  tickCount: 0,
  init() {
    for (let i = 0; i < LAYER_COUNT; i++) {
      const seeded = CoreDeque.dequeue();
      this.layerFiles.push(seeded);
      if (seeded) CoreDeque.enqueue(seeded);
    }
    State.currentBgFile = BgDeque.dequeue();
    if (State.currentBgFile) BgDeque.enqueue(State.currentBgFile);
    VisualLayer.applySkybox(State.currentBgFile, true);
    for (let i = 0; i < LAYER_COUNT; i++) VisualLayer.applyLayerTexture(i, this.layerFiles[i], true);
    this.preload();
  },
  cycle() {
    const newBg = BgDeque.dequeue();
    if (!newBg) return;
    BgDeque.enqueue(newBg);

    const enteringCore = State.currentBgFile;
    State.currentBgFile = newBg;
    VisualLayer.applySkybox(newBg);

    this.tickCount++;

    for (let i = 0; i < LAYER_COUNT; i++) {
      if (this.tickCount % LAYER_STRIDE[i] !== 0) continue;
      const incoming = i === 0 ? enteringCore : this.layerFiles[i - 1];
      if (!incoming) continue;
      if (i === LAYER_COUNT - 1 && this.layerFiles[i]) {
        BgDeque.enqueue(this.layerFiles[i]);
      }
      this.layerFiles[i] = incoming;
      VisualLayer.applyLayerTexture(i, incoming);
    }

    this.preload();
  },
  preload() {
    for (let n = 0; n < PRELOAD_LOOKAHEAD; n++) {
      const bgUp = BgDeque.peekAt(n);
      const coreUp = CoreDeque.peekAt(n);
      if (bgUp) ImageStore.load(`assets/audio/bg/${bgUp}`);
      if (coreUp) ImageStore.load(`assets/audio/core/${coreUp}`);
    }
  }
};

const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyzer: null,
  data: new Uint8Array(128),
  source: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyzer = this.ctx.createAnalyser();
    this.analyzer.fftSize = 256;
    this.analyzer.smoothingTimeConstant = 0.8;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyzer);
    this.analyzer.connect(this.ctx.destination);
    this.audio.crossOrigin = "anonymous";
    this.audio.volume = 1;
  },
  ensureRunning() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  getBins() {
    if (!this.analyzer) return this.data;
    this.analyzer.getByteFrequencyData(this.data);
    return this.data;
  },
  getIntensity() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 24; i++) sum += bins[i];
    return sum / (24 * 255);
  },
  getBass() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 8; i++) sum += bins[i];
    return sum / (8 * 255);
  },
  lastBeatAt: 0,
  detectBeat() {
    const bass = this.getBass();
    const now = performance.now();
    const hit = bass > 0.45 && now - this.lastBeatAt > 180;
    if (hit) this.lastBeatAt = now;
    return hit ? bass : 0;
  },
  loadTrack(index) {
    State.trackIndex = index;
    this.audio.src = `assets/audio/${playlist[index]}`;
    document.getElementById('track-info').innerText = songTitles[playlist[index]] || playlist[index];
    this.audio.play().catch(() => {});
    this.ensureRunning();
    if (State.started) {
      AssetChain.cycle();
      State.lastCycleAt = performance.now();
    }
  },
  toggle(e) {
    if (e) e.stopPropagation();
    this.audio.paused ? this.audio.play().catch(() => {}) : this.audio.pause();
    this.ensureRunning();
  },
  setVolume(v) {
    this.audio.volume = Number(v);
  }
};

const GRAVITY_MODES = ['fall', 'rise', 'still'];

const VisualLayer = {
  bg: {
    canvas: document.getElementById('bg-canvas'),
    ctx: null,
    current: null,
    next: null,
    alpha: 1,
    nextAlpha: 0
  },
  mid: {
    canvas: document.getElementById('mid-canvas'),
    ctx: null,
    layers: []
  },
  fg: {
    canvas: document.getElementById('fg-canvas'),
    ctx: null,
    layers: []
  },
  gravityMode: 0,
  touchTarget: { x: 0, y: 0 },
  touchDrift: { x: 0, y: 0 },
  lastBeatCycleAt: 0,
  resize() {
    const w = window.innerWidth - 20;
    const h = window.innerHeight - 205;
    for (const key of ['bg', 'mid', 'fg']) {
      const c = this[key].canvas;
      c.width = Math.floor(w * Math.min(window.devicePixelRatio || 1, 2));
      c.height = Math.floor(h * Math.min(window.devicePixelRatio || 1, 2));
      c.style.width = w + 'px';
      c.style.height = h + 'px';
      this[key].ctx = c.getContext('2d');
      this[key].ctx.imageSmoothingEnabled = true;
      this[key].ctx.imageSmoothingQuality = 'high';
    }
  },
  init() {
    this.resize();
    this.mid.layers = this.makeLayers(3, 0.52, 0.25);
    this.fg.layers = this.makeLayers(2, 0.84, 0.18);
    this.loop();
  },
  makeLayers(count, opacity, scaleStep) {
    const arr = [];
    for (let i = 0; i < count; i++) {
      arr.push({
        file: null,
        img: null,
        x: 0,
        y: 0,
        scale: 1 + i * scaleStep,
        opacity: opacity - i * 0.12,
        rotation: (Math.random() - 0.5) * 0.1,
        blur: i === 0 ? 0 : i * 1.5,
        blend: i === 0 ? 'source-over' : (i === 1 ? 'screen' : 'lighter'),
        driftX: (Math.random() - 0.5) * 0.7,
        driftY: (Math.random() - 0.5) * 0.5,
        phase: Math.random() * Math.PI * 2,
        pulse: 1,
        baseOpacity: opacity - i * 0.12
      });
    }
    return arr;
  },
  loadTexture(path) {
    return ImageStore.load(path);
  },
  applySkybox(bgFile, instant) {
    if (!bgFile) return;
    const next = this.loadTexture(`assets/audio/bg/${bgFile}`);
    if (!this.bg.current || instant) {
      this.bg.current = next;
      this.bg.alpha = 1;
      this.bg.nextAlpha = 0;
    } else {
      this.bg.next = next;
      this.bg.nextAlpha = 0;
    }
  },
  applyLayerTexture(layerIndex, coreFile, instant) {
    if (!coreFile) return;
    const all = [...this.mid.layers, ...this.fg.layers];
    const layer = all[layerIndex];
    if (!layer) return;
    layer.file = coreFile;
    layer.img = this.loadTexture(`assets/audio/core/${coreFile}`);
    if (instant) layer.pulse = 1;
  },
  cycleGravityMode(e) {
    if (e) e.stopPropagation();
    this.gravityMode = (this.gravityMode + 1) % GRAVITY_MODES.length;
    document.getElementById('mode-label').innerText = `Layers: ${LAYER_COUNT} / Gravity: ${GRAVITY_MODES[this.gravityMode]}`;
  },
  clear(ctx, canvas) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  },
  drawBg(intensity) {
    const ctx = this.bg.ctx;
    const canvas = this.bg.canvas;
    this.clear(ctx, canvas);

    const w = canvas.width;
    const h = canvas.height;

    if (this.bg.current && this.bg.current.complete) {
      ctx.save();
      ctx.globalAlpha = this.bg.alpha;
      ctx.drawImage(this.bg.current, 0, 0, w, h);
      ctx.restore();
    }

    if (this.bg.next && this.bg.next.complete) {
      this.bg.nextAlpha = Math.min(1, this.bg.nextAlpha + 0.02 + intensity * 0.02);
      ctx.save();
      ctx.globalAlpha = this.bg.nextAlpha;
      ctx.drawImage(this.bg.next, 0, 0, w, h);
      ctx.restore();

      if (this.bg.nextAlpha >= 1) {
        this.bg.current = this.bg.next;
        this.bg.next = null;
        this.bg.alpha = 1;
        this.bg.nextAlpha = 0;
      }
    }

    ctx.save();
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,0.12)');
    g.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    ctx.restore();
  },
  drawLayer(ctx, canvas, layer, xShift, yShift, intensity, bass, t) {
    if (!layer.img || !layer.img.complete) return;
    const w = canvas.width;
    const h = canvas.height;
    const img = layer.img;
    const iw = img.naturalWidth || img.width;
    const ih = img.naturalHeight || img.height;
    if (!iw || !ih) return;

    const coverScale = Math.max(w / iw, h / ih);
    const s = coverScale * layer.scale * layer.pulse;
    const dw = iw * s;
    const dh = ih * s;
    const dx = (w - dw) * 0.5 + xShift + layer.driftX * w * 0.06;
    const dy = (h - dh) * 0.5 + yShift + layer.driftY * h * 0.06;

    ctx.save();
    ctx.globalAlpha = layer.baseOpacity * layer.opacity * layer.pulse;
    ctx.filter = `blur(${layer.blur}px)`;
    ctx.globalCompositeOperation = layer.blend;
    ctx.translate(w / 2, h / 2);
    ctx.rotate(layer.rotation + Math.sin(t * 0.0007 + layer.phase) * 0.03);
    ctx.scale(1 + intensity * 0.08 + bass * 0.04, 1 + intensity * 0.08 + bass * 0.04);
    ctx.translate(-w / 2, -h / 2);
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.restore();
  },
  drawMid(intensity, bass) {
    const ctx = this.mid.ctx;
    const canvas = this.mid.canvas;
    this.clear(ctx, canvas);
    const t = performance.now();

    const mode = GRAVITY_MODES[this.gravityMode];
    const xBase = this.touchDrift.x * canvas.width * 0.08;
    const yBase = this.touchDrift.y * canvas.height * 0.06;

    for (let i = 0; i < this.mid.layers.length; i++) {
      const layer = this.mid.layers[i];
      const phase = layer.phase;
      const sway = Math.sin(t * 0.001 + phase) * (18 + i * 8);
      const drift = Math.cos(t * 0.0008 + phase) * (12 + i * 5);
      let yShift = yBase + drift;
      if (mode === 'fall') yShift += (t * 0.01) % canvas.height * 0.002;
      if (mode === 'rise') yShift -= (t * 0.01) % canvas.height * 0.002;
      this.drawLayer(ctx, canvas, layer, xBase + sway, yShift, intensity, bass, t);
    }
  },
  drawFg(intensity, bass) {
    const ctx = this.fg.ctx;
    const canvas = this.fg.canvas;
    this.clear(ctx, canvas);
    const t = performance.now();

    const xBase = this.touchDrift.x * canvas.width * 0.12;
    const yBase = this.touchDrift.y * canvas.height * 0.08;

    for (let i = 0; i < this.fg.layers.length; i++) {
      const layer = this.fg.layers[i];
      layer.pulse = 1 + intensity * 0.18 + bass * 0.15 * (i === 0 ? 1 : 0.6);
      layer.rotation += 0.0003 + intensity * 0.0006;
      const sway = Math.sin(t * 0.0013 + layer.phase) * (24 + i * 10);
      const drift = Math.cos(t * 0.0011 + layer.phase) * (14 + i * 4);
      this.drawLayer(ctx, canvas, layer, xBase + sway, yBase + drift, intensity, bass, t);
    }

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.globalAlpha = 0.18 + intensity * 0.16;
    const g = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.45, 30, canvas.width * 0.5, canvas.height * 0.45, Math.max(canvas.width, canvas.height) * 0.45);
    g.addColorStop(0, `hsla(${State.hue}, 100%, 70%, 0.45)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  },
  updateTouch() {
    this.touchDrift.x += (this.touchTarget.x - this.touchDrift.x) * 0.04;
    this.touchDrift.y += (this.touchTarget.y - this.touchDrift.y) * 0.04;
  },
  registerTouch(event) {
    const rect = document.body.getBoundingClientRect();
    const xNorm = (event.clientX / rect.width) * 2 - 1;
    const yNorm = -((event.clientY / rect.height) * 2 - 1);
    this.touchTarget = { x: xNorm * 0.8, y: yNorm * 0.5 };
  },
  loop() {
    requestAnimationFrame(() => this.loop());

    const intensity = AudioLayer.getIntensity();
    const bass = AudioLayer.getBass();
    const beatHit = AudioLayer.detectBeat();
    const now = performance.now();

    if (now - State.lastCycleAt > CYCLE_MS) {
      AssetChain.cycle();
      State.lastCycleAt = now;
    } else if (beatHit > 0 && now - this.lastBeatCycleAt > BEAT_CYCLE_COOLDOWN_MS) {
      AssetChain.cycle();
      this.lastBeatCycleAt = now;
      State.lastCycleAt = now;
    }

    this.updateTouch();
    this.drawBg(intensity);
    this.drawMid(intensity, bass);
    this.drawFg(intensity, bass);
  }
};

const UILayer = {
  togglePlaylist(e) {
    if (e) e.stopPropagation();
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  changeColor(e) {
    if (e) e.stopPropagation();
    State.hue = (State.hue + 22) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildPlaylist() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerText = songTitles[t] || t;
      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.loadTrack(i);
        this.togglePlaylist();
      });
      list.appendChild(item);
    });
  }
};

const InputLayer = {
  handle(e) {
    if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
    if (!State.started) {
      AudioLayer.init();
      VisualLayer.init();
      AssetChain.init();
      UILayer.buildPlaylist();
      State.started = true;
      State.lastCycleAt = performance.now();
      AudioLayer.loadTrack(0);
    } else {
      AudioLayer.ensureRunning();
      AssetChain.cycle();
      State.lastCycleAt = performance.now();
      VisualLayer.registerTouch(e);
    }
  },
  skip(n, e) {
    if (e) e.stopPropagation();
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.loadTrack(State.trackIndex);
  }
};

AudioLayer.audio.onended = () => InputLayer.skip(1);
AudioLayer.audio.addEventListener('error', () => InputLayer.skip(1));
window.addEventListener('resize', () => VisualLayer.resize());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
