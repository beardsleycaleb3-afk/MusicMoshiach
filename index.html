<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    :root { 
      --hue: 30; 
      --frame-color: hsl(var(--hue), 100%, 50%); 
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%); 
    }
    body { 
      margin:0; background:#000; overflow:hidden; touch-action:none; 
      font-family:sans-serif; -webkit-tap-highlight-color: transparent;
      user-select: none; -webkit-user-select: none;
      border: 30px solid var(--frame-color);
      box-sizing: border-box; height: 100vh;
    }
    #bg-container, #canvas-container { 
      position:fixed; top:10px; left:10px; 
      width:calc(100vw - 20px); height:calc(100vh - 195px); 
      overflow:hidden; border-bottom: 10px solid var(--frame-color);
    }
    #bg-container { z-index:0; background-size:cover; background-position:center; transition: background-image 0.5s ease-in-out; }
    #canvas-container { z-index:1; pointer-events:none; }
    
    #hud { 
      position:fixed; bottom:0; left:0; width:100%; height:175px; 
      background: #000; display:flex; flex-direction:column; 
      align-items:center; justify-content:space-evenly; z-index:100; padding:5px; box-sizing: border-box;
    }
    #odometer-container { width: 90%; height: 15px; background: #050505; border: 4px solid var(--frame-color); overflow: hidden; }
    #ekg-canvas { width: 100%; height: 100%; filter: drop-shadow(0 0 8px var(--frame-color)); }

    .deck { 
      display:flex; gap:8px; justify-content:center; width: 95%; 
      padding: 10px; border: 8px solid var(--frame-color); box-sizing: border-box;
    }
    .btn { 
      width:44px; height:44px; border:14px solid var(--btn-color); 
      background:#000; color: #fff; display:flex; align-items:center; 
      justify-content:center; cursor: pointer; touch-action: manipulation;
    }
    .btn span { font-size: 22px; pointer-events: none; }

    #vol-slider { width: 55%; height: 20px; appearance: none; background: #222; outline: none; }
    #vol-slider::-webkit-slider-thumb { appearance: none; width: 40px; height: 20px; background: var(--btn-color); }

    #playlist-screen { position: fixed; inset: 0; background: #131; z-index: 200; display: none; flex-direction: column; padding: 10px; overflow-y: auto; touch-action: pan-y; }
    #track-list { -webkit-overflow-scrolling: touch; }
    .track-item { padding: 10px; color: var(--frame-color); border-bottom: 14px solid #222; font-size: 1.5rem; touch-action: manipulation; }
    #track-info { color:var(--frame-color); font-size:1.5rem; font-weight:bold; text-align: center; }
    
    * { border-radius: 50 !important; }
  </style>
</head>
<body onpointerdown="handleInteraction(event)">

<div id="bg-container"></div>
<div id="canvas-container"></div>
<div id="playlist-screen">
    <div style="text-align:right; color:white; font-size:32px; padding: 10px;" onpointerdown="togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
</div>

<div id="hud">
  <div id="track-info">MusicMoshiach</div>
  <div id="mode-label" style="color:var(--frame-color);font-size:1rem;">Mode: liquid</div>
  <div id="odometer-container"><canvas id="ekg-canvas"></canvas></div>
  <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="setVol(this.value)" onpointerdown="event.stopPropagation()">
  <div class="deck">
    <div class="btn" onpointerdown="toggle(event)"><span>⏯️</span></div>
    <div class="btn" onpointerdown="skip(1, event)"><span>⏭️</span></div>
    <div class="btn" onpointerdown="changeColor(event)"><span>👻</span></div>
    <div class="btn" onpointerdown="cycleVisualMode(event)"><span>🎛️</span></div>
    <div class="btn" onpointerdown="togglePlaylist(event)"><span>🌶️</span></div>
    <div class="btn" onpointerdown="installApp(event)"><span>👾</span></div>
  </div>
</div>

<script>
const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];
const songTitles = {"9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3": "frequencies death","24.mp3": "death frequency 2", "25.mp3": "false star", "26.mp3": "Fifteen Trillion","27.mp3": "fractured shadow", "28.mp3": "FOD", "29.mp3": "FOD 4","30.mp3": "Gods King of Kings", "31.mp3": "Hidden Sultan of Vishnu","32.mp3": "hiss", "33.mp3": "Hook Will NAIL You", "34.mp3": "HOOKED ON THE HISS","35.mp3": "Ignition Arch. X NanoFile","38.mp3": "limit breaks", "39.mp3": "MOON Monster Melody X Comment", "40.mp3": "New one","41.mp3": "no blanking", "42.mp3": "noise swells", "43.mp3": "phantom X Hidden","44.mp3": "phoenix dark", "45.mp3": "planet command", "46.mp3": "Roll over Once","47.mp3": "rust fold", "48.mp3": "ss ii py f", "49.mp3": "ten by seven","50.mp3": "the dark","51.mp3": "the hook", "52.mp3": "THE TRUTH", "53.mp3": "The prophecy","55.mp3": "tuned for death", "56.mp3": "unsteady echo", "57.mp3": "ur decension","58.mp3": "When the curtain moves", "59.mp3": "wildcard subnet", "60.mp3": "yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"};

const coreFiles = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];
const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

let trackIdx = 0, poolIdx = 0, bgIdx = 0, isStarted = false, currentHue = 30, visualMode = 0;
const visualModes = ['liquid','spiky','ripple','warp','gridfile'];
let audio = new Audio(), audioCtx, analyzer, dataArray;
let scene, camera, renderer, mainSphere, texLoader, minis = [];
let ekgCanvas, ekgCtx, isRoaming = false, velocity = new THREE.Vector3(0,0,0);
const bounds = { x: 3.2, y: 4.2 };
let gridTiles = [], tileIndices = [], gridSize = 5;

// Optimization: Pool of geometry/materials to reuse
const sphereGeo = new THREE.IcosahedronGeometry(1.6, 5);
const miniGeo = new THREE.SphereGeometry(0.1, 8, 8); // Simplified geometry for performance

function handleInteraction(e) {
  if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
  if (!isStarted) {
    initThreeJS(); initAudio(); initEKG(); buildPlaylist();
    isStarted = true; loadTrack();
    setInterval(autoCycleVisuals, 8800);
  } else {
    isRoaming = !isRoaming;
    if (isRoaming) velocity.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 0);
    triggerChaos();
  }
}

function autoCycleVisuals() { advanceVisualCycle(); }

function advanceVisualCycle() {
  visualMode = (visualMode + 1) % visualModes.length;
  document.getElementById('mode-label').innerText = `Mode: ${visualModes[visualMode]}`;
  bgIdx = (bgIdx + 1) % bgs.length;
  poolIdx = (poolIdx + 1) % coreFiles.length;
  
  if (visualMode === 4) {
    if (mainSphere) scene.remove(mainSphere);
    clearMinis();
    initGridFile();
  } else {
    gridTiles.forEach(tile => scene.remove(tile));
    gridTiles = [];
    if (!mainSphere) {
      mainSphere = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({transparent:true, opacity:0.82, side: THREE.DoubleSide}));
      mainSphere.userData.basePositions = sphereGeo.attributes.position.array.slice();
      scene.add(mainSphere);
    }
  }
  triggerChaos();
  applyVisuals();
}

function triggerChaos() {
  bgIdx = Math.floor(Math.random() * bgs.length);
  poolIdx = Math.floor(Math.random() * coreFiles.length);
  applyVisuals();
  if (visualMode !== 4) {
    // Spawn only a limited number to keep frame rate high
    for (let i = 0; i < 8; i++) spawnMini();
  } else {
    shuffleGridImages();
  }
}

// Performance: Recycling objects instead of creating new ones
function spawnMini() {
  if (minis.length > 50) return; // Cap density
  const mat = new THREE.MeshBasicMaterial({map: mainSphere.material.map, transparent:true, opacity:0.7});
  const mini = new THREE.Mesh(miniGeo, mat);
  
  mini.userData = { 
    angle: Math.random() * Math.PI * 2, 
    angleStep: (Math.random() - 0.5) * 0.05,
    radius: 0.1, 
    speed: 0.01 + Math.random() * 0.02, 
    dir: 1, 
    life: 1.0
  };
  scene.add(mini);
  minis.push(mini);
}

function clearMinis() {
  minis.forEach(m => scene.remove(m));
  minis = [];
}

function changeColor(e) {
  e.stopPropagation();
  currentHue = (currentHue + 72) % 360;
  document.documentElement.style.setProperty('--hue', currentHue);
}

function cycleVisualMode(e) {
  if (e) e.stopPropagation();
  advanceVisualCycle();
}

function initEKG() { 
  ekgCanvas = document.getElementById('ekg-canvas'); 
  ekgCtx = ekgCanvas.getContext('2d'); 
  ekgCanvas.width = ekgCanvas.offsetWidth; 
  ekgCanvas.height = ekgCanvas.offsetHeight; 
}

function drawMirroredWire(intensity) {
  if (!dataArray) return;
  analyzer.getByteFrequencyData(dataArray);
  ekgCtx.clearRect(0, 0, ekgCanvas.width, ekgCanvas.height);
  ekgCtx.beginPath(); 
  ekgCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--frame-color');
  
  const midX = ekgCanvas.width / 2;
  const centerY = ekgCanvas.height / 2;
  const sliceWidth = midX / 20;

  for (let i = 0; i < 20; i++) {
    const val = (dataArray[i] / 255) * (ekgCanvas.height * 0.5);
    const xL = midX - (i * sliceWidth);
    const xR = midX + (i * sliceWidth);
    ekgCtx.moveTo(xL, centerY - val); ekgCtx.lineTo(xL, centerY + val);
    ekgCtx.moveTo(xR, centerY - val); ekgCtx.lineTo(xR, centerY + val);
  }
  ekgCtx.stroke();
}

function initThreeJS() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, (window.innerWidth - 20) / (window.innerHeight - 205), 0.1, 1000);
  renderer = new THREE.WebGLRenderer({alpha:true, antialias:false}); // Antialias:false increases speed
  renderer.setPixelRatio(1); // Force pixel ratio 1 for performance
  renderer.setSize(window.innerWidth - 20, window.innerHeight - 205);
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  texLoader = new THREE.TextureLoader();
  mainSphere = new THREE.Mesh(sphereGeo, new THREE.MeshStandardMaterial({transparent: true, opacity: 0.8, side: THREE.DoubleSide}));
  mainSphere.userData.basePositions = sphereGeo.attributes.position.array.slice();
  scene.add(mainSphere);
  
  camera.position.z = 6;
  applyVisuals();
  animate();
}

function initGridFile() {
  gridTiles = [];
  const tileSize = 0.8;
  for (let y = 0; y < gridSize; y++) {
    for (let x = 0; x < gridSize; x++) {
      const tile = new THREE.Mesh(new THREE.PlaneGeometry(tileSize, tileSize), new THREE.MeshBasicMaterial({transparent: true}));
      tile.position.set((x-2)*(tileSize+0.1), (y-2)*(tileSize+0.1), 0);
      tile.userData = { basePos: tile.position.clone(), active: false };
      scene.add(tile);
      gridTiles.push(tile);
    }
  }
  shuffleGridImages();
}

function shuffleGridImages() {
  gridTiles.forEach(tile => {
    const file = coreFiles[Math.floor(Math.random() * coreFiles.length)];
    texLoader.load(`assets/audio/core/${file}`, (tex) => { tile.material.map = tex; tile.material.needsUpdate = true; });
  });
}

function animate() {
  requestAnimationFrame(animate);
  let intensity = dataArray ? dataArray[1] / 255 : 0;
  drawMirroredWire(intensity);
  
  if (visualMode !== 4) {
    // Pulse mesh
    mainSphere.scale.setScalar(0.5 + intensity * 2);
    mainSphere.rotation.y += 0.01;
    
    // Update Particles (Minis)
    for (let i = minis.length - 1; i >= 0; i--) {
      let m = minis[i];
      m.userData.radius += m.userData.speed;
      m.userData.angle += 0.02;
      m.position.set(Math.cos(m.userData.angle) * m.userData.radius, Math.sin(m.userData.angle) * m.userData.radius, 0);
      m.scale.setScalar(1 + intensity * 2);
      
      if (m.userData.radius > 5) { scene.remove(m); minis.splice(i, 1); }
    }
  } else {
    // Grid animation
    gridTiles.forEach(t => t.rotation.z += intensity * 0.1);
  }
  renderer.render(scene, camera);
}

function loadTrack() { audio.src = `assets/audio/${playlist[trackIdx]}`; document.getElementById('track-info').innerText = songTitles[playlist[trackIdx]] || playlist[trackIdx]; audio.play().catch(()=>{}); }
function skip(n, e) { if(e) e.stopPropagation(); trackIdx = (trackIdx + n + playlist.length) % playlist.length; loadTrack(); }
function applyVisuals() { 
  if (visualMode !== 4) {
    document.getElementById('bg-container').style.backgroundImage = `url('assets/audio/bg/${bgs[bgIdx]}')`; 
    mainSphere.material.map = texLoader.load(`assets/audio/core/${coreFiles[poolIdx]}`);
  }
}
function toggle(e) { if(e) e.stopPropagation(); audio.paused ? audio.play() : audio.pause(); }
function setVol(v) { audio.volume = v; }
function togglePlaylist(e) { if(e) e.stopPropagation(); const s = document.getElementById('playlist-screen'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; }
function buildPlaylist() { 
    const list = document.getElementById('track-list'); 
    playlist.forEach((track, i) => { 
        const item = document.createElement('div'); 
        item.className = 'track-item'; 
        item.innerText = songTitles[track] || track; 
        item.onpointerdown = (e) => { e.stopPropagation(); trackIdx = i; loadTrack(); togglePlaylist(); };
        list.appendChild(item); 
    }); 
}
function installApp(e) { if(e) e.stopPropagation(); alert("MusicMoshiach"); }

function initAudio() { 
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyzer = audioCtx.createAnalyser();
  analyzer.fftSize = 128;
  const source = audioCtx.createMediaElementSource(audio);
  source.connect(analyzer);
  analyzer.connect(audioCtx.destination);
  dataArray = new Uint8Array(analyzer.frequencyBinCount);
}

audio.onended = () => skip(1);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
