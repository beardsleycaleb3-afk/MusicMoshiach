<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    :root {
      --hue: 30;
      --frame-color: hsl(var(--hue), 100%, 50%);
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%);
    }
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
    body { border: 10px solid var(--frame-color); }
    #renderCanvas {
      position: fixed; top: 10px; left: 10px;
      width: calc(100vw - 20px); height: calc(100vh - 195px);
      outline: none; touch-action: none; z-index: 1;
    }
    #hud {
      position: fixed; left: 0; bottom: 0; width: 100%; height: 175px;
      z-index: 100; background: #000; display: flex; flex-direction: column;
      align-items: center; justify-content: space-evenly; padding: 5px;
    }
    #track-info { color: var(--frame-color); font-size: 1.5rem; font-weight: bold; text-align: center; }
    #mode-label { color: var(--frame-color); font-size: 1rem; text-align: center; }
    #vol-slider { width: 55%; height: 10px; appearance: none; background: #222; outline: none; }
    #vol-slider::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; background: var(--btn-color); }
    .deck { display: flex; gap: 8px; justify-content: center; width: 95%; padding: 10px; border: 1px solid var(--frame-color); }
    .btn {
      width: 34px; height: 44px; border: 1px solid var(--btn-color); background: #000; color: #fff;
      display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: manipulation;
    }
    .btn span { font-size: 22px; pointer-events: none; }
    #playlist-screen {
      position: fixed; inset: 0; background: #131; z-index: 200; display: none;
      flex-direction: column; padding: 10px; overflow-y: auto; touch-action: pan-y;
    }
    #close-playlist { text-align: right; color: white; font-size: 22px; padding: 10px; cursor: pointer; }
    .track-item { padding: 10px; color: var(--frame-color); border-bottom: 4px solid #222; font-size: 1.5rem; touch-action: manipulation; }
  </style>
</head>
<body>

  <canvas id="renderCanvas"></canvas>

  <div id="playlist-screen">
    <div id="close-playlist">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">BPM: -- | Layers: 6</div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1">
    <div class="deck">
      <div class="btn" id="btn-play"><span>⏯️</span></div>
      <div class="btn" id="btn-skip"><span>⏭️</span></div>
      <div class="btn" id="btn-color"><span>👻</span></div>
      <div class="btn" id="btn-gravity"><span>🎛️</span></div>
      <div class="btn" id="btn-playlist"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {
  started: false,
  trackIndex: 0,
  hue: 30,
  currentBgFile: null,
  lastCycleAt: 0,
  estimatedBpm: 0
};

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const songTitles = {
  "9.mp3":"99 to 1","10.mp3":"retribu x protocol","11.mp3":"Xenon Rain","12.mp3":"Sultan of Vishnu","13.mp3":"Stray Signal","14.mp3":"Planet Commandments","15.mp3":"The Reckoning","16.mp3":"Time Leaks Silver","17.mp3":"Fear Forced Fate","18.mp3":"King of Glyphs","19.mp3":"dawns king","20.mp3":"red sunday","21.mp3":"Daylight made me","22.mp3":"death frequencies","23.mp3":"frequencies death","24.mp3":"death frequency 2","25.mp3":"false star","26.mp3":"Fifteen Trillion","27.mp3":"fractured shadow","28.mp3":"FOD","29.mp3":"FOD 4","30.mp3":"Gods King of Kings","31.mp3":"Hidden Sultan of Vishnu","32.mp3":"hiss","33.mp3":"Hook Will NAIL You","34.mp3":"HOOKED ON THE HISS","35.mp3":"Ignition Arch. X NanoFile","38.mp3":"limit breaks","39.mp3":"MOON Monster Melody X Comment","40.mp3":"New one","41.mp3":"no blanking","42.mp3":"noise swells","43.mp3":"phantom X Hidden","44.mp3":"phoenix dark","45.mp3":"planet command","46.mp3":"Roll over Once","47.mp3":"rust fold","48.mp3":"ss ii py f","49.mp3":"ten by seven","50.mp3":"the dark","51.mp3":"the hook","52.mp3":"THE TRUTH","53.mp3":"The prophecy","55.mp3":"tuned for death","56.mp3":"unsteady echo","57.mp3":"ur decension","58.mp3":"When the curtain moves","59.mp3":"wildcard subnet","60.mp3":"yo my people","1.mp3":"Zero Son","2.mp3":"Aftertone 2","3.mp3":"Aint in the darkness","4.mp3":"Alpha-betz","5.mp3":"laphazeta x","6.mp3":"Birdseye","7.mp3":"Broken limits","8.mp3":"what you are"
};

const coreFiles  = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];

const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

function makeDeque(seedList) {
  const items = seedList.slice();
  return {
    items,
    enqueue(v) { this.items.push(v); },
    dequeue() { return this.items.length ? this.items.shift() : null; },
    peekAt(n) { return this.items.length ? this.items[n % this.items.length] : null; }
  };
}

const BgDeque = makeDeque(bgs);
const CoreDeque = makeDeque(coreFiles);

const LAYER_COUNT = 6;
const CYCLE_MS = 10000;
const BEAT_CYCLE_COOLDOWN_MS = 2400;
const PRELOAD_LOOKAHEAD = 3;
const GRAVITY_MODES = ['fall', 'rise', 'still'];

/* ───────────── Audio + BPM ───────────── */
const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyser: null,
  data: new Uint8Array(128),
  source: null,
  lastBeatAt: 0,
  beatIntervals: [],
  estimatedBpm: 0,

  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyser = this.ctx.createAnalyser();
    this.analyser.fftSize = 256;
    this.analyser.smoothingTimeConstant = 0.75;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyser);
    this.analyser.connect(this.ctx.destination);
    this.audio.crossOrigin = 'anonymous';
    this.audio.volume = 1;
  },

  ensureRunning() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },

  getBins() {
    if (!this.analyser) return this.data;
    this.analyser.getByteFrequencyData(this.data);
    return this.data;
  },

  getIntensity() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 32; i++) sum += bins[i];
    return sum / (32 * 255);
  },

  getBass() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 8; i++) sum += bins[i];
    return sum / (8 * 255);
  },

  detectBeat() {
    const bass = this.getBass();
    const now = performance.now();
    const hit = bass > 0.48 && (now - this.lastBeatAt) > 160;
    if (hit) {
      if (this.lastBeatAt > 0) {
        const interval = now - this.lastBeatAt;
        this.beatIntervals.push(interval);
        if (this.beatIntervals.length > 12) this.beatIntervals.shift();
        // median-ish BPM
        const sorted = this.beatIntervals.slice().sort((a, b) => a - b);
        const mid = sorted[Math.floor(sorted.length / 2)];
        this.estimatedBpm = Math.round(60000 / mid);
        State.estimatedBpm = this.estimatedBpm;
      }
      this.lastBeatAt = now;
      return bass;
    }
    return 0;
  },

  loadTrack(index) {
    State.trackIndex = index;
    this.audio.src = `assets/audio/${playlist[index]}`;
    document.getElementById('track-info').textContent = songTitles[playlist[index]] || playlist[index];
    this.audio.play().catch(() => {});
    this.ensureRunning();
    this.beatIntervals = [];
    if (State.started) {
      AssetChain.cycle(true);
      State.lastCycleAt = performance.now();
    }
  },

  toggle() {
    this.audio.paused ? this.audio.play().catch(() => {}) : this.audio.pause();
    this.ensureRunning();
  },

  setVolume(v) { this.audio.volume = Number(v); }
};

/* ───────────── Asset cycling ───────────── */
const AssetChain = {
  layerFiles: [],
  tickCount: 0,

  init() {
    for (let i = 0; i < LAYER_COUNT; i++) {
      const seeded = CoreDeque.dequeue();
      this.layerFiles.push(seeded);
      if (seeded) CoreDeque.enqueue(seeded);
    }
    State.currentBgFile = BgDeque.dequeue();
    if (State.currentBgFile) BgDeque.enqueue(State.currentBgFile);
    VisualLayer.applySkybox(State.currentBgFile);
    for (let i = 0; i < LAYER_COUNT; i++) VisualLayer.applyLayerTexture(i, this.layerFiles[i]);
    this.preload();
  },

  cycle(force = false) {
    const newBg = BgDeque.dequeue();
    if (!newBg) return;
    BgDeque.enqueue(newBg);

    const enteringCore = State.currentBgFile;
    State.currentBgFile = newBg;
    VisualLayer.applySkybox(newBg);

    this.tickCount++;

    for (let i = 0; i < LAYER_COUNT; i++) {
      // different strides so layers change at different rates
      const stride = [1, 1, 2, 2, 3, 4][i] || 1;
      if (!force && this.tickCount % stride !== 0) continue;

      const incoming = i === 0 ? enteringCore : this.layerFiles[i - 1];
      if (!incoming) continue;

      if (i === LAYER_COUNT - 1 && this.layerFiles[i]) {
        // recycle last core back into bg pool occasionally
        // (keeps visual variety)
      }
      this.layerFiles[i] = incoming;
      VisualLayer.applyLayerTexture(i, incoming);
    }
    this.preload();
  },

  preload() {
    for (let n = 0; n < PRELOAD_LOOKAHEAD; n++) {
      const bgUp = BgDeque.peekAt(n);
      const coreUp = CoreDeque.peekAt(n);
      if (bgUp) VisualLayer.preloadTexture(`assets/audio/bg/${bgUp}`);
      if (coreUp) VisualLayer.preloadTexture(`assets/audio/core/${coreUp}`);
    }
  }
};

/* ───────────── Babylon Visual Layer ───────────── */
const VisualLayer = {
  engine: null,
  scene: null,
  camera: null,
  skyMesh: null,
  skyMat: null,
  meshes: [],
  gravityMode: 0,
  touchTarget: { x: 0, y: 0 },
  lastBeatCycleAt: 0,
  textureCache: new Map(),

  init() {
    const canvas = document.getElementById('renderCanvas');
    this.engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
    this.scene = new BABYLON.Scene(this.engine);
    this.scene.clearColor = new BABYLON.Color4(0, 0, 0, 1);

    // Camera – touch controlled
    this.camera = new BABYLON.ArcRotateCamera('cam', -Math.PI / 2, Math.PI / 2.4, 18, BABYLON.Vector3.Zero(), this.scene);
    this.camera.lowerRadiusLimit = 8;
    this.camera.upperRadiusLimit = 40;
    this.camera.wheelPrecision = 40;
    this.camera.panningSensibility = 0; // pure rotate + zoom via touch

    // Soft light
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), this.scene);
    hemi.intensity = 0.65;
    const point = new BABYLON.PointLight('pt', new BABYLON.Vector3(0, 4, 6), this.scene);
    point.intensity = 0.55;

    // Background sphere (inverted)
    this.skyMesh = BABYLON.MeshBuilder.CreateSphere('sky', { diameter: 120, segments: 32 }, this.scene);
    this.skyMat = new BABYLON.StandardMaterial('skyMat', this.scene);
    this.skyMat.backFaceCulling = false;
    this.skyMat.disableLighting = true;
    this.skyMat.emissiveColor = new BABYLON.Color3(0.7, 0.7, 0.7);
    this.skyMesh.material = this.skyMat;
    this.skyMesh.infiniteDistance = true;

    // Multiple shaped meshes that receive core textures
    const shapes = [
      () => BABYLON.MeshBuilder.CreateSphere('s0', { diameter: 3.2, segments: 24 }, this.scene),
      () => BABYLON.MeshBuilder.CreateBox('s1', { size: 2.6 }, this.scene),
      () => BABYLON.MeshBuilder.CreateTorus('s2', { diameter: 3.4, thickness: 0.7, tessellation: 32 }, this.scene),
      () => BABYLON.MeshBuilder.CreateCylinder('s3', { height: 3.5, diameter: 2.2, tessellation: 24 }, this.scene),
      () => BABYLON.MeshBuilder.CreatePlane('s4', { size: 4.2, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, this.scene),
      () => BABYLON.MeshBuilder.CreateIcoSphere('s5', { radius: 2.1, subdivisions: 2 }, this.scene)
    ];

    for (let i = 0; i < LAYER_COUNT; i++) {
      const mesh = shapes[i]();
      const mat = new BABYLON.StandardMaterial(`mat${i}`, this.scene);
      mat.diffuseColor = new BABYLON.Color3(1, 1, 1);
      mat.emissiveColor = new BABYLON.Color3(0.15, 0.15, 0.15);
      mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
      mesh.material = mat;

      // spread them in space
      const angle = (i / LAYER_COUNT) * Math.PI * 2;
      mesh.position = new BABYLON.Vector3(
        Math.cos(angle) * (4 + i * 0.6),
        (Math.sin(angle * 1.3) * 2.5) - 1,
        Math.sin(angle) * (4 + i * 0.6)
      );
      mesh.rotation = new BABYLON.Vector3(
        Math.random() * Math.PI,
        Math.random() * Math.PI,
        Math.random() * Math.PI
      );

      this.meshes.push({
        mesh,
        mat,
        basePos: mesh.position.clone(),
        phase: Math.random() * Math.PI * 2,
        rotSpeed: new BABYLON.Vector3(
          (Math.random() - 0.5) * 0.015,
          (Math.random() - 0.5) * 0.02,
          (Math.random() - 0.5) * 0.01
        ),
        file: null
      });
    }

    // Render loop
    this.engine.runRenderLoop(() => this.tick());
    window.addEventListener('resize', () => this.engine.resize());
  },

  preloadTexture(url) {
    if (this.textureCache.has(url)) return this.textureCache.get(url);
    const tex = new BABYLON.Texture(url, this.scene, false, true, BABYLON.Texture.TRILINEAR_SAMPLINGMODE);
    this.textureCache.set(url, tex);
    return tex;
  },

  applySkybox(bgFile) {
    if (!bgFile || !this.skyMat) return;
    const url = `assets/audio/bg/${bgFile}`;
    const tex = this.preloadTexture(url);
    this.skyMat.emissiveTexture = tex;
    this.skyMat.diffuseTexture = tex;
  },

  applyLayerTexture(index, coreFile) {
    if (!coreFile || !this.meshes[index]) return;
    const url = `assets/audio/core/${coreFile}`;
    const tex = this.preloadTexture(url);
    const entry = this.meshes[index];
    entry.file = coreFile;
    entry.mat.diffuseTexture = tex;
    entry.mat.emissiveTexture = tex;
    entry.mat.emissiveColor = new BABYLON.Color3(0.35, 0.35, 0.35);
  },

  cycleGravityMode() {
    this.gravityMode = (this.gravityMode + 1) % GRAVITY_MODES.length;
    this.updateModeLabel();
  },

  updateModeLabel() {
    const bpmStr = State.estimatedBpm > 40 ? State.estimatedBpm : '--';
    document.getElementById('mode-label').textContent =
      `BPM: ${bpmStr} | Gravity: ${GRAVITY_MODES[this.gravityMode]} | Layers: ${LAYER_COUNT}`;
  },

  registerTouch(clientX, clientY) {
    const rect = this.engine.getRenderingCanvas().getBoundingClientRect();
    const xNorm = ((clientX - rect.left) / rect.width) * 2 - 1;
    const yNorm = -(((clientY - rect.top) / rect.height) * 2 - 1);
    this.touchTarget = { x: xNorm * 0.9, y: yNorm * 0.6 };
  },

  tick() {
    if (!this.scene) return;

    const intensity = AudioLayer.getIntensity();
    const bass = AudioLayer.getBass();
    const beatHit = AudioLayer.detectBeat();
    const now = performance.now();
    const t = now * 0.001;

    // BPM / time + beat driven cycling
    if (now - State.lastCycleAt > CYCLE_MS) {
      AssetChain.cycle();
      State.lastCycleAt = now;
    } else if (beatHit > 0 && now - this.lastBeatCycleAt > BEAT_CYCLE_COOLDOWN_MS) {
      AssetChain.cycle();
      this.lastBeatCycleAt = now;
      State.lastCycleAt = now;
    }

    // update BPM label occasionally
    if (Math.floor(t * 2) % 2 === 0) this.updateModeLabel();

    // Camera gentle drift toward touch
    if (this.camera) {
      this.camera.alpha += this.touchTarget.x * 0.012;
      this.camera.beta = BABYLON.Scalar.Clamp(
        this.camera.beta - this.touchTarget.y * 0.01,
        0.25, Math.PI - 0.25
      );
    }

    // Animate each mesh with audio
    const mode = GRAVITY_MODES[this.gravityMode];
    this.meshes.forEach((entry, i) => {
      const { mesh, mat, basePos, phase, rotSpeed } = entry;

      // rotation driven by intensity + bass
      mesh.rotation.x += rotSpeed.x * (1 + intensity * 3 + bass * 2);
      mesh.rotation.y += rotSpeed.y * (1 + intensity * 2.5);
      mesh.rotation.z += rotSpeed.z * (1 + bass * 1.5);

      // scale pulse
      const pulse = 1 + intensity * 0.35 + bass * 0.45 * (i % 2 === 0 ? 1 : 0.6);
      mesh.scaling.setAll(pulse);

      // position sway + gravity modes
      let yOff = Math.sin(t * 0.7 + phase) * 0.9;
      if (mode === 'fall') yOff -= (t * 0.4 + i) % 6 - 3;
      if (mode === 'rise') yOff += (t * 0.4 + i) % 6 - 3;

      mesh.position.x = basePos.x + Math.cos(t * 0.5 + phase) * (0.8 + intensity);
      mesh.position.y = basePos.y + yOff;
      mesh.position.z = basePos.z + Math.sin(t * 0.55 + phase) * (0.8 + intensity);

      // emissive glow from bass
      const glow = 0.2 + bass * 0.7 + intensity * 0.3;
      mat.emissiveColor.set(glow, glow * 0.85, glow * 0.7);
    });

    // subtle sky rotation
    if (this.skyMesh) {
      this.skyMesh.rotation.y += 0.0008 + intensity * 0.002;
    }

    this.scene.render();
  }
};

/* ───────────── UI ───────────── */
const UILayer = {
  togglePlaylist() {
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  changeColor() {
    State.hue = (State.hue + 22) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildPlaylist() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.textContent = songTitles[t] || t;
      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.loadTrack(i);
        this.togglePlaylist();
      });
      list.appendChild(item);
    });
  }
};

/* ───────────── Input (touch only via event listeners) ───────────── */
const InputLayer = {
  pointerId: null,

  start() {
    if (State.started) return;
    AudioLayer.init();
    VisualLayer.init();
    AssetChain.init();
    UILayer.buildPlaylist();
    State.started = true;
    State.lastCycleAt = performance.now();
    AudioLayer.loadTrack(0);
  },

  skip(n) {
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.loadTrack(State.trackIndex);
  }
};

/* Bind all controls with event listeners – no inline handlers */
document.getElementById('btn-play').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  if (!State.started) InputLayer.start();
  else AudioLayer.toggle();
});
document.getElementById('btn-skip').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  InputLayer.skip(1);
});
document.getElementById('btn-color').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  UILayer.changeColor();
});
document.getElementById('btn-gravity').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  VisualLayer.cycleGravityMode();
});
document.getElementById('btn-playlist').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  UILayer.togglePlaylist();
});
document.getElementById('close-playlist').addEventListener('pointerdown', (e) => {
  e.stopPropagation();
  UILayer.togglePlaylist();
});
document.getElementById('vol-slider').addEventListener('input', (e) => {
  AudioLayer.setVolume(e.target.value);
});
document.getElementById('vol-slider').addEventListener('pointerdown', (e) => e.stopPropagation());

/* Canvas / body touch handling */
const canvas = document.getElementById('renderCanvas');
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (!State.started) {
    InputLayer.start();
    return;
  }
  AudioLayer.ensureRunning();
  InputLayer.pointerId = e.pointerId;
  canvas.setPointerCapture(e.pointerId);
  VisualLayer.registerTouch(e.clientX, e.clientY);
  // also force a visual cycle on hard touch
  AssetChain.cycle();
  State.lastCycleAt = performance.now();
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== InputLayer.pointerId) return;
  VisualLayer.registerTouch(e.clientX, e.clientY);
});
canvas.addEventListener('pointerup', (e) => {
  if (e.pointerId === InputLayer.pointerId) {
    InputLayer.pointerId = null;
    canvas.releasePointerCapture(e.pointerId);
  }
});
canvas.addEventListener('pointercancel', (e) => {
  if (e.pointerId === InputLayer.pointerId) {
    InputLayer.pointerId = null;
  }
});

// Prevent HUD from starting the engine accidentally, but allow buttons
document.getElementById('hud').addEventListener('pointerdown', (e) => {
  if (e.target.closest('.btn') || e.target.id === 'vol-slider') return;
  e.stopPropagation();
});

AudioLayer.audio.addEventListener('ended', () => InputLayer.skip(1));
AudioLayer.audio.addEventListener('error', () => InputLayer.skip(1));

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
