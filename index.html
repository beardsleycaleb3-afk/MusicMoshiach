<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MusicMoshiach</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
  <style>
    :root {
      --hue: 30;
      --frame-color: hsl(var(--hue), 100%, 50%);
      --btn-color: hsl(calc(var(--hue) + 180), 100%, 50%);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      touch-action: none;
    }

    body {
      border: 10px solid var(--frame-color);
    }

    #bg-container,
    #canvas-container,
    #overlay-container {
      position: fixed;
      top: 10px;
      left: 10px;
      width: calc(100vw - 20px);
      height: calc(100vh - 195px);
      overflow: hidden;
      border-bottom: 10px solid var(--frame-color);
    }

    #bg-container {
      z-index: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out;
      opacity: 1;
    }

    #canvas-container {
      z-index: 1;
      pointer-events: none;
    }

    #overlay-container {
      z-index: 2;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 175px;
      z-index: 100;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 5px;
    }

    #track-info {
      color: var(--frame-color);
      font-size: 1.5rem;
      font-weight: bold;
      text-align: center;
    }

    #mode-label {
      color: var(--frame-color);
      font-size: 1rem;
      text-align: center;
    }

    #odometer-container {
      width: 90%;
      height: 35px;
      background: #050505;
      border: 1px solid var(--frame-color);
      overflow: hidden;
    }

    #ekg-canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 0 8px var(--frame-color));
    }

    #overlay-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #vol-slider {
      width: 55%;
      height: 10px;
      appearance: none;
      background: #222;
      outline: none;
    }

    #vol-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      background: var(--btn-color);
    }

    .deck {
      display: flex;
      gap: 8px;
      justify-content: center;
      width: 95%;
      padding: 10px;
      border: 1px solid var(--frame-color);
    }

    .btn {
      width: 34px;
      height: 44px;
      border: 1px solid var(--btn-color);
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn span {
      font-size: 22px;
      pointer-events: none;
    }

    #playlist-screen {
      position: fixed;
      inset: 0;
      background: #131;
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 10px;
      overflow-y: auto;
      touch-action: pan-y;
    }

    #close-playlist {
      text-align: right;
      color: white;
      font-size: 22px;
      padding: 10px;
      cursor: pointer;
    }

    .track-item {
      padding: 10px;
      color: var(--frame-color);
      border-bottom: 4px solid #222;
      font-size: 1.5rem;
      touch-action: manipulation;
    }
  </style>
</head>
<body onpointerdown="InputLayer.handle(event)">

  <div id="bg-container"></div>
  <div id="canvas-container"></div>
  <div id="overlay-container"><canvas id="overlay-canvas"></canvas></div>

  <div id="playlist-screen">
    <div id="close-playlist" onpointerdown="UILayer.togglePlaylist(event)">✕</div>
    <div id="track-list"></div>
  </div>

  <div id="hud">
    <div id="track-info">MusicMoshiach</div>
    <div id="mode-label">Mode: liquid</div>
    <div id="odometer-container"><canvas id="ekg-canvas"></canvas></div>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="1" oninput="AudioLayer.setVolume(this.value)" onpointerdown="event.stopPropagation()">
    <div class="deck">
      <div class="btn" onpointerdown="AudioLayer.toggle(event)"><span>⏯️</span></div>
      <div class="btn" onpointerdown="InputLayer.skip(1, event)"><span>⏭️</span></div>
      <div class="btn" onpointerdown="UILayer.changeColor(event)"><span>👻</span></div>
      <div class="btn" onpointerdown="VisualLayer.cycleVisualMode(event)"><span>🎛️</span></div>
      <div class="btn" onpointerdown="UILayer.togglePlaylist(event)"><span>🌶️</span></div>
    </div>
  </div>

<script>
const State = {

const playlist = ["9.mp3","10.mp3","11.mp3","12.mp3","13.mp3","14.mp3","15.mp3","16.mp3","17.mp3","18.mp3","19.mp3","20.mp3","21.mp3","22.mp3","23.mp3","24.mp3","25.mp3","26.mp3","27.mp3","28.mp3","29.mp3","30.mp3","31.mp3","32.mp3","33.mp3","34.mp3","35.mp3","38.mp3","39.mp3","40.mp3","41.mp3","42.mp3","43.mp3","44.mp3","45.mp3","46.mp3","47.mp3","48.mp3","49.mp3","50.mp3","51.mp3","52.mp3","53.mp3","55.mp3","56.mp3","57.mp3","58.mp3","59.mp3","60.mp3","1.mp3","2.mp3","3.mp3","4.mp3","5.mp3","6.mp3","7.mp3","8.mp3"];

const coreFiles = ['a.jpeg','aa.jpeg','aaa.jpeg','b.jpeg','bb.jpeg','bbb.jpeg','c.jpeg','cc.jpeg','ccc.jpeg','d.jpeg','dd.jpeg','ddd.jpeg','e.jpeg','ee.jpeg','eee.jpeg','f.jpeg','ff.jpeg','fff.jpeg','g.jpeg','gg.jpeg','ggg.jpeg','h.jpeg','hh.jpeg','i.jpeg','ii.jpeg','iii.jpeg','j.jpeg','jj.jpeg','jjj.jpeg','k.jpeg','kk.jpeg','kkk.jpeg','l.jpeg','ll.jpeg','lll.jpeg','m.jpeg','mm.jpeg','mmm.jpeg','n.jpeg','nn.jpeg','o.jpeg','oo.jpeg','p.jpeg','pp.jpeg','q.jpeg','qq.jpeg','r.jpeg','rr.jpeg','s.jpeg','ss.jpeg','t.jpeg','tt.jpeg','u.jpeg','uu.jpeg','v.jpeg','vv.jpeg','w.jpeg','x.jpeg','xx.jpeg','y.jpeg','yy.jpeg','z.jpeg','zz.jpeg'];

const bgs = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg','7.jpg','8.jpg','9.jpg','10.jpg','11.jpg','12.jpg','13.jpg','14.jpg','15.jpg','16.jpg','17.jpg','18.jpg','19.jpg','20.jpg','21.jpg','22.jpg','23.jpg','24.jpg','25.jpg','26.jpg','27.jpg','28.jpg','29.jpg','30.jpg','31.jpg','32.jpg','33.jpg','34.jpg','35.jpg','36.jpg','37.jpg','38.jpg','40.jpg','41.jpg','42.jpg','43.jpg','44.jpg','45.jpg','46.jpg','47.jpg','48.jpg','49.jpg','50.jpg','51.jpg','52.jpg','54.jpg','55.jpg','56.jpg','57.jpg','59.jpg','60.jpg','61.jpg','62.jpg','63.jpg','64.jpg','65.jpg'];

const AudioLayer = {
  audio: new Audio(),
  ctx: null,
  analyzer: null,
  data: new Uint8Array(128),
  source: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.analyzer = this.ctx.createAnalyser();
    this.analyzer.fftSize = 256;
    this.analyzer.smoothingTimeConstant = 0.8;
    this.source = this.ctx.createMediaElementSource(this.audio);
    this.source.connect(this.analyzer);
    this.analyzer.connect(this.ctx.destination);
    this.audio.crossOrigin = "anonymous";
    this.audio.volume = 1;
  },
  ensureRunning() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  getBins() {
    if (!this.analyzer) return this.data;
    this.analyzer.getByteFrequencyData(this.data);
    return this.data;
  },
  getIntensity() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 0; i < 24; i++) sum += bins[i];
    return sum / (24 * 255);
  },
  getMids() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 24; i < 72; i++) sum += bins[i];
    return sum / (48 * 255);
  },
  getHighs() {
    const bins = this.getBins();
    let sum = 0;
    for (let i = 72; i < 128; i++) sum += bins[i];
    return sum / (56 * 255);
  },
  detectBeat() {
    const bins = this.getBins();
    let bass = 0;
    for (let i = 0; i < 8; i++) bass += bins[i];
    bass = bass / (8 * 255);
    const now = performance.now();
    const hit = bass > 0.42 && now - State.lastBeatAt > 180;
    if (hit) {
      State.lastBeatAt = now;
      State.recentPeaks.push(now);
      if (State.recentPeaks.length > 8) State.recentPeaks.shift();
      State.queue.push({ type: 'beat', at: now, strength: bass });
    }
    return hit ? bass : 0;
  },
  loadTrack(index) {
    State.trackIndex = index;
    State.bgIndex = index % bgs.length;
    State.coreIndex = index % coreFiles.length;
    this.audio.src = `assets/audio/${playlist[index]}`;
    document.getElementById('track-info').innerText = songTitles[playlist[index]] || playlist[index];
    VisualLayer.updateAssets(index);
    this.audio.play().catch(() => {});
    this.ensureRunning();
  },
  toggle(e) {
    if (e) e.stopPropagation();
    this.audio.paused ? this.audio.play().catch(() => {}) : this.audio.pause();
    this.ensureRunning();
  },
  setVolume(v) {
    this.audio.volume = Number(v);
  }
};

const VisualLayer = {
  scene: new THREE.Scene(),
  renderer: null,
  camera: null,
  texLoader: new THREE.TextureLoader(),
  textureCache: new Map(),
  mainSphere: null,
  overlayCanvas: null,
  overlayCtx: null,
  offscreenCanvas: null,
  offscreenCtx: null,
  overlayAlpha: 0.82,
  altOpacityPhase: 0,
  ekgCanvas: null,
  ekgCtx: null,
  miniBurst: [],
  touchOrbiters: [],
  cameraMode: 0,
  chargeLevel: 0,
  chargeMax: 18,
  chargeDecay: 0.008,
  explosionCooldown: 0,
  burstCooldown: 0,
  cameraShake: 0,
  lastDropAt: 0,
  drift: new THREE.Vector3(0, 0, 0),
  bounds: { x: 2.0, y: 1.3 },
  init() {
    this.renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    this.renderer.setSize(window.innerWidth - 20, window.innerHeight - 205);
    this.renderer.setClearColor(0x000000, 0);
    document.getElementById('canvas-container').appendChild(this.renderer.domElement);

    this.camera = new THREE.PerspectiveCamera(55, (window.innerWidth - 20) / (window.innerHeight - 205), 0.1, 1000);
    this.camera.position.z = 6;

    this.scene.add(new THREE.AmbientLight(0x2a2a2a));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(4, 5, 6);
    this.scene.add(key);

    const fill = new THREE.PointLight(0xff66cc, 0.9, 20);
    fill.position.set(-4, -2, 5);
    this.scene.add(fill);

    const rim = new THREE.PointLight(0x66ccff, 0.8, 18);
    rim.position.set(2, 1, -3);
    this.scene.add(rim);

    const geo = new THREE.IcosahedronGeometry(1.6, 4);
    const mat = new THREE.MeshStandardMaterial({
      transparent: true,
      opacity: 0.68,
      roughness: 0.22,
      metalness: 0.42,
      emissive: new THREE.Color(0x111111),
      emissiveIntensity: 0.35,
      side: THREE.DoubleSide,
      depthWrite: false
    });
    this.mainSphere = new THREE.Mesh(geo, mat);
    this.mainSphere.userData.basePositions = geo.attributes.position.array.slice();
    this.mainSphere.renderOrder = 2;
    this.scene.add(this.mainSphere);

    this.overlayCanvas = document.getElementById('overlay-canvas');
    this.overlayCtx = this.overlayCanvas.getContext('2d');
    this.ekgCanvas = document.getElementById('ekg-canvas');
    this.ekgCtx = this.ekgCanvas.getContext('2d');
    this.resize();
    this.refreshOffscreenCanvas();
    this.loop();
  },
  refreshOffscreenCanvas() {
    if (!this.overlayCanvas) return;
    const w = this.overlayCanvas.width;
    const h = this.overlayCanvas.height;
    if ('OffscreenCanvas' in window) {
      this.offscreenCanvas = new OffscreenCanvas(w, h);
      this.offscreenCtx = this.offscreenCanvas.getContext('2d');
    } else {
      this.offscreenCanvas = document.createElement('canvas');
      this.offscreenCanvas.width = w;
      this.offscreenCanvas.height = h;
      this.offscreenCtx = this.offscreenCanvas.getContext('2d');
    }
  },
  resize() {
    const w = window.innerWidth - 20;
    const h = window.innerHeight - 205;
    if (this.renderer) this.renderer.setSize(w, h);
    if (this.camera) {
      this.camera.aspect = w / h;
      this.camera.updateProjectionMatrix();
    }
    if (this.overlayCanvas) {
      this.overlayCanvas.width = this.overlayCanvas.offsetWidth;
      this.overlayCanvas.height = this.overlayCanvas.offsetHeight;
    }
    if (this.ekgCanvas) {
      this.ekgCanvas.width = this.ekgCanvas.offsetWidth;
      this.ekgCanvas.height = this.ekgCanvas.offsetHeight;
    }
    this.refreshOffscreenCanvas();
  },
  loadTexture(path) {
    if (this.textureCache.has(path)) return this.textureCache.get(path);
    const tex = this.texLoader.load(path);
    this.textureCache.set(path, tex);
    return tex;
  },
  updateAssets(index) {
    const corePath = `assets/audio/core/${coreFiles[index % coreFiles.length]}`;
    const bgPath = `assets/audio/bg/${bgs[index % bgs.length]}`;
    document.getElementById('bg-container').style.backgroundImage = `url('${bgPath}')`;
    if (this.mainSphere) {
      this.mainSphere.material.map = this.loadTexture(corePath);
      this.mainSphere.material.opacity = 0.48;
      this.mainSphere.material.needsUpdate = true;
    }
  },
  updateGeometry(intensity, mids, highs) {
    if (!this.mainSphere) return;
    const positions = this.mainSphere.geometry.attributes.position;
    const normals = this.mainSphere.geometry.attributes.normal;
    const base = this.mainSphere.userData.basePositions;
    const t = performance.now() * 0.0015;
    const mode = State.visualMode;

    for (let i = 0; i < positions.count; i++) {
      const ix = i * 3;
      const bx = base[ix];
      const by = base[ix + 1];
      const bz = base[ix + 2];
      const nx = normals.getX(i);
      const ny = normals.getY(i);
      const nz = normals.getZ(i);
      const radius = Math.sqrt(bx * bx + by * by + bz * bz);
      const phase = i / positions.count * Math.PI * 4;
      const wave = Math.sin(t * 2.5 + phase) * 0.09;
      const burst = Math.cos(radius * 6 - t * 2) * 0.12;
      const baseSwell = intensity * 0.6 + mids * 0.25 + highs * 0.18;
      let distortion;

      if (mode === 0) {
        distortion = baseSwell * 0.9 + wave + Math.sin(radius * 8 - t * 3) * 0.06;
      } else if (mode === 1) {
        distortion = baseSwell * 1.1 + Math.abs(Math.cos(phase * 2 + t * 2.8)) * 0.24 + burst * 0.3;
      } else if (mode === 2) {
        distortion = Math.sin(radius * 10 - t * 3.2 + phase) * 0.26 + mids * 0.4 + highs * 0.3;
      } else {
        distortion = (Math.sin(t * 2 + phase) + Math.cos(radius * 14 - t * 1.6)) * 0.18 + baseSwell * 0.7;
      }

      const jitter = Math.sin(t * 5 + phase * 2) * 0.01;
      positions.setXYZ(i, bx + nx * (distortion + jitter), by + ny * (distortion + jitter), bz + nz * (distortion + jitter));
    }

    positions.needsUpdate = true;
    this.mainSphere.geometry.computeVertexNormals();
  },
  drawWave(intensity) {
    if (!this.ekgCtx) return;
    const ctx = this.ekgCtx;
    const c = this.ekgCanvas;
    const bins = AudioLayer.getBins();
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.beginPath();
    ctx.lineWidth = 2 + intensity * 3;
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--frame-color');

    const midY = c.height / 2;
    const steps = 48;
    const step = c.width / steps;

    for (let i = 0; i < steps; i++) {
      const v = bins[i] / 255;
      const y = midY - v * c.height * (0.45 + intensity * 0.6);
      const x = i * step;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  },
  drawOverlay(intensity) {
    if (!this.overlayCtx) return;
    const ctx = this.overlayCtx;
    const c = this.overlayCanvas;
    ctx.clearRect(0, 0, c.width, c.height);

    const now = performance.now();
    const drawCtx = this.offscreenCtx || ctx;
    if (drawCtx) {
      drawCtx.clearRect(0, 0, c.width, c.height);
      for (const item of State.queue) {
        if (item.type === 'beat') {
          const age = now - item.at;
          const life = 520;
          if (age < life) {
            const p = age / life;
            const alpha = Math.max(0, 1 - p);
            const rad = (c.width * 0.08) + (item.strength * c.width * 0.28) * (1 + p);
            drawCtx.beginPath();
            drawCtx.arc(c.width * 0.5, c.height * 0.5, rad, 0, Math.PI * 2);
            drawCtx.strokeStyle = `hsla(${State.hue}, 100%, 65%, ${alpha * 0.6})`;
            drawCtx.lineWidth = 3 + item.strength * 10;
            drawCtx.stroke();

            drawCtx.beginPath();
            drawCtx.arc(c.width * 0.5, c.height * 0.5, rad * 1.12, 0, Math.PI * 2);
            drawCtx.strokeStyle = `hsla(${(State.hue + 80) % 360}, 100%, 70%, ${alpha * 0.32})`;
            drawCtx.lineWidth = 1.5;
            drawCtx.stroke();
          }
        }
      }
    }
    State.queue = State.queue.filter(item => now - item.at < 520);

    if (intensity > 0.18) {
      const count = Math.min(12, Math.floor(4 + intensity * 16));
      for (let i = 0; i < count; i++) {
        const x = (Math.sin(now * 0.0007 + i * 0.7) * 0.5 + 0.5) * c.width;
        const y = (Math.cos(now * 0.0009 + i * 1.1) * 0.5 + 0.5) * c.height;
        const r = 1 + Math.random() * (4 + intensity * 18);
        drawCtx.beginPath();
        drawCtx.fillStyle = `hsla(${(State.hue + i * 18) % 360}, 100%, 68%, ${0.08 + intensity * 0.14})`;
        drawCtx.arc(x, y, r, 0, Math.PI * 2);
        drawCtx.fill();
      }
    }

    if (intensity > 0.3) {
      const lines = 3;
      for (let i = 0; i < lines; i++) {
        drawCtx.beginPath();
        drawCtx.moveTo(0, (c.height / lines) * i + (Math.sin(now * 0.002 + i) * 20));
        drawCtx.bezierCurveTo(c.width * 0.25, c.height * 0.2 + Math.sin(now * 0.0015 + i) * 30, c.width * 0.75, c.height * 0.8 - Math.cos(now * 0.0013 + i) * 30, c.width, (c.height / lines) * i + 20);
        drawCtx.strokeStyle = `hsla(${(State.hue + i * 30) % 360}, 90%, 65%, ${0.08 + intensity * 0.08})`;
        drawCtx.lineWidth = 1.5;
        drawCtx.stroke();
      }
    }

    if (ctx && this.offscreenCanvas) {
      const alphaTarget = 0.42 + Math.sin(this.altOpacityPhase) * 0.08 + intensity * 0.2;
      this.altOpacityPhase += 0.016;
      this.overlayAlpha += (alphaTarget - this.overlayAlpha) * 0.08;
      this.overlayAlpha = Math.max(0.2, Math.min(0.98, this.overlayAlpha));
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.globalAlpha = this.overlayAlpha;
      ctx.drawImage(this.offscreenCanvas, 0, 0, c.width, c.height);
      ctx.globalAlpha = 1;
    }
  },
  spawnMiniBurst(strength) {
    const count = 3 + Math.floor(strength * 18);
    for (let i = 0; i < count; i++) {
      const size = 0.05 + Math.random() * 0.08;
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(size, 12, 12),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color(`hsl(${(State.hue + Math.random() * 120) % 360}, 90%, 60%)`),
          transparent: true,
          opacity: 0.72,
          emissive: new THREE.Color(`hsl(${(State.hue + Math.random() * 120) % 360}, 90%, 40%)`),
          emissiveIntensity: 0.8,
          roughness: 0.18,
          metalness: 0.45,
          side: THREE.DoubleSide
        })
      );
      particle.position.copy(this.mainSphere.position);
      particle.userData = {
        velocity: new THREE.Vector3((Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.14, (Math.random() - 0.5) * 0.12),
        life: 1,
        decay: 0.009 + Math.random() * 0.02
      };
      this.scene.add(particle);
      this.miniBurst.push(particle);
    }
  },
  updateMiniBurst(intensity) {
    for (let i = this.miniBurst.length - 1; i >= 0; i--) {
      const particle = this.miniBurst[i];
      particle.position.addScaledVector(particle.userData.velocity, 1 + intensity * 0.8);
      particle.rotation.x += 0.04 + Math.random() * 0.05;
      particle.rotation.y += 0.03 + Math.random() * 0.04;
      particle.material.opacity = Math.max(0, particle.material.opacity - particle.userData.decay);
      particle.material.emissiveIntensity = Math.max(0, particle.material.emissiveIntensity - particle.userData.decay * 0.4);
      particle.scale.multiplyScalar(0.992 + intensity * 0.001);
      particle.userData.life -= particle.userData.decay;
      if (particle.userData.life <= 0 || particle.material.opacity <= 0.02) {
        this.scene.remove(particle);
        this.miniBurst.splice(i, 1);
      }
    }
  },
  spawnTouchOrbiters(event) {
    if (!this.mainSphere || !this.camera) return;
    const rect = document.body.getBoundingClientRect();
    const xNorm = (event.clientX / rect.width) * 2 - 1;
    const yNorm = -((event.clientY / rect.height) * 2 - 1);
    const baseX = xNorm * 1.8;
    const baseY = yNorm * 1.2;
    const hue = (State.hue + Math.floor(event.clientX + event.clientY)) % 360;
    const opacity = 0.72;
    const count = 3 + Math.floor(Math.random() * 3);

    for (let i = 0; i < count; i++) {
      const size = 0.08 + Math.random() * 0.08;
      const orbitRadius = 0.9 + Math.random() * 1.5;
      const zOrbit = 0.4 + Math.random() * 1.1;
      const particle = new THREE.Mesh(
        new THREE.SphereGeometry(size, 12, 12),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color(`hsl(${(hue + i * 30) % 360}, 90%, 62%)`),
          transparent: true,
          opacity,
          emissive: new THREE.Color(`hsl(${(hue + i * 30 + 80) % 360}, 100%, 55%)`),
          emissiveIntensity: 0.9,
          roughness: 0.12,
          metalness: 0.25,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide
        })
      );
      particle.position.set(baseX, baseY, -0.3);
      particle.userData = {
        angle: Math.random() * Math.PI * 2,
        zAngle: Math.random() * Math.PI * 2,
        speed: 0.008 + Math.random() * 0.015,
        radius: orbitRadius,
        zRadius: zOrbit,
        phase: Math.random() * Math.PI * 2,
        hue,
        life: 1,
        decay: 0.005 + Math.random() * 0.008,
        alpha: opacity
      };
      this.scene.add(particle);
      this.touchOrbiters.push(particle);
    }
  },
  updateTouchOrbiters(intensity) {
    const now = performance.now();
    const chargeRatio = Math.min(1, this.chargeLevel / this.chargeMax);
    for (let i = this.touchOrbiters.length - 1; i >= 0; i--) {
      const orb = this.touchOrbiters[i];
      const isSucking = chargeRatio > 0.45 || orb.userData.life < 0.35;
      orb.userData.angle += orb.userData.speed * (1 + intensity * 1.5);
      orb.userData.zAngle += orb.userData.speed * 0.9 * (1 + intensity * 0.8);
      const angle = orb.userData.angle;
      const zAngle = orb.userData.zAngle;
      const targetX = Math.cos(angle + orb.userData.phase) * orb.userData.radius;
      const targetY = Math.sin(angle - orb.userData.phase) * orb.userData.radius * 0.7;
      const targetZ = Math.sin(zAngle + orb.userData.phase) * orb.userData.zRadius - 0.2;
      orb.position.set(targetX, targetY, targetZ);
      if (isSucking && this.mainSphere) {
        orb.position.lerp(this.mainSphere.position, 0.03 + chargeRatio * 0.12 + intensity * 0.02);
      }
      orb.rotation.x += 0.015 + intensity * 0.01;
      orb.rotation.y += 0.02 + intensity * 0.008;
      const wave = 0.12 + Math.abs(Math.sin(now * 0.0012 + orb.userData.phase)) * 0.12;
      orb.scale.setScalar(1 + wave * 0.18);
      const alpha = Math.max(0.1, orb.userData.alpha * (0.8 + Math.sin(now * 0.0015 + orb.userData.phase) * 0.12));
      orb.material.opacity = alpha;
      orb.material.emissiveIntensity = 0.7 + Math.abs(Math.sin(now * 0.0016 + orb.userData.phase)) * 0.5;
      const r = Math.floor(120 + 135 * Math.sin((orb.userData.hue + 0) * Math.PI / 180));
      const g = Math.floor(80 + 175 * Math.sin((orb.userData.hue + 120) * Math.PI / 180));
      const b = Math.floor(140 + 100 * Math.cos((orb.userData.hue + 240) * Math.PI / 180));
      orb.material.color.setRGB(r / 255, g / 255, b / 255);
      orb.userData.life -= orb.userData.decay + intensity * 0.001;
      const dist = this.mainSphere ? orb.position.distanceTo(this.mainSphere.position) : Infinity;
      if (orb.userData.life <= 0 || orb.material.opacity <= 0.08 || dist < 0.28) {
        this.scene.remove(orb);
        this.touchOrbiters.splice(i, 1);
        if (dist < 0.28) {
          this.spawnMiniBurst(0.8);
          this.chargeLevel = Math.min(this.chargeMax, this.chargeLevel + 0.8);
        }
      }
    }
    this.chargeLevel = Math.max(0, this.chargeLevel - this.chargeDecay - intensity * 0.005);
    if (this.chargeLevel >= this.chargeMax && performance.now() - this.explosionCooldown > 240) {
      this.triggerChargeExplosion();
    }
  },
  triggerChargeExplosion() {
    const blastPower = Math.min(1, this.chargeLevel / this.chargeMax);
    const burstCount = 6 + Math.floor(blastPower * 16);
    for (let i = 0; i < burstCount; i++) {
      this.spawnMiniBurst(0.9 + blastPower * 0.6);
    }
    this.cameraShake = Math.min(1.5, this.cameraShake + 0.6 + blastPower * 0.42);
    this.chargeLevel = 0;
    this.explosionCooldown = performance.now();
    while (this.touchOrbiters.length) {
      const orb = this.touchOrbiters.pop();
      this.scene.remove(orb);
    }
  },
  updateCameraView(intensity) {
    if (!this.camera) return;
    const t = performance.now() * 0.0006;
    const shake = this.cameraShake;
    if (this.cameraMode === 0) {
      this.camera.position.set(Math.sin(t) * 0.16 + shake * 0.2, Math.cos(t) * 0.1 + shake * 0.1, 6);
    } else if (this.cameraMode === 1) {
      this.camera.position.set(4.0 + shake * 0.14, Math.sin(t * 1.2) * 1.0 + 1.4, Math.cos(t * 1.1) * 1.8 + 2.2);
    } else if (this.cameraMode === 2) {
      this.camera.position.set(Math.cos(t * 0.9) * 2.6 + shake * 0.1, 2.4 + shake * 0.16, Math.sin(t * 1.3) * 2.0 + 0.6);
    } else {
      this.camera.position.set(Math.sin(t * 1.1) * 2.8 + shake * 0.14, Math.cos(t * 1.3) * 1.9 + shake * 0.12, Math.sin(t * 0.7) * 2.6 + 1.8);
      this.camera.rotation.order = 'ZYX';
      this.camera.rotation.z = Math.sin(t * 0.4) * 0.12;
    }
    this.camera.lookAt(0, 0, 0);
    this.camera.fov = 52 + Math.sin(t * 1.1) * 4 + (this.cameraMode === 3 ? 5 : 0);
    this.camera.updateProjectionMatrix();
  },
  animateSphere(intensity, bassHit) {
    if (!this.mainSphere) return;

    if (bassHit > 0 && performance.now() - this.burstCooldown > 120) {
      this.spawnMiniBurst(bassHit);
      this.burstCooldown = performance.now();
    }

    const driftTarget = bassHit > 0 ? 0.25 : 0.04;
    this.drift.x += (Math.random() - 0.5) * 0.004;
    this.drift.y += (Math.random() - 0.5) * 0.004;
    this.mainSphere.rotation.x += this.drift.x * driftTarget;
    this.mainSphere.rotation.y += this.drift.y * driftTarget;

    const wobble = Math.sin(performance.now() * 0.002 + State.trackIndex) * 0.13;
    this.mainSphere.rotation.z = wobble * 0.3;

    const scale = 0.7 + intensity * 2.2 + bassHit * 0.7;
    this.mainSphere.scale.setScalar(scale);
    if (this.renderer && this.renderer.domElement) {
      const opacityTarget = 0.42 + Math.sin(performance.now() * 0.0015) * 0.08 + intensity * 0.2;
      this.altOpacityPhase += 0.006;
      this.renderer.domElement.style.opacity = Math.max(0.35, Math.min(0.92, opacityTarget));
    }

    this.mainSphere.material.opacity = 0.48 + intensity * 0.32;
    this.mainSphere.material.emissive = new THREE.Color(`hsl(${(State.hue + State.bgIndex * 4 + bassHit * 80) % 360}, 88%, ${18 + intensity * 22}%)`);
    this.mainSphere.material.emissiveIntensity = 0.35 + intensity * 0.55;

    if (bassHit > 0) {
      this.mainSphere.position.x += (Math.random() - 0.5) * 0.045;
      this.mainSphere.position.y += (Math.random() - 0.5) * 0.045;
      this.cameraShake = Math.min(0.75, this.cameraShake + bassHit * 0.12);
    } else {
      this.mainSphere.position.lerp(new THREE.Vector3(0, 0, 0), 0.05);
      this.cameraShake *= 0.93;
    }

    if (this.camera) {
      this.camera.position.x = Math.sin(performance.now() * 0.0007) * 0.12 + this.cameraShake * 0.2;
      this.camera.position.y = Math.cos(performance.now() * 0.0006) * 0.09 + this.cameraShake * 0.18;
      this.camera.lookAt(0, 0, 0);
    }
  },
  cycleVisualMode(e) {
    if (e) e.stopPropagation();
    State.visualMode = (State.visualMode + 1) % 4;
    this.cameraMode = (this.cameraMode + 1) % 4;
    document.getElementById('mode-label').innerText = `Mode: ${['liquid','spiky','ripple','warp'][State.visualMode]} / View ${this.cameraMode + 1}`;
    this.updateAssets(State.trackIndex);
  },
  loop() {
    requestAnimationFrame(() => this.loop());

    const intensity = AudioLayer.getIntensity();
    const mids = AudioLayer.getMids();
    const highs = AudioLayer.getHighs();
    const bassHit = AudioLayer.detectBeat();

    if (bassHit > 0) {
      State.beatEnergy = bassHit;
      State.history.push({ at: performance.now(), value: bassHit });
      if (State.history.length > 64) State.history.shift();
    }

    this.updateGeometry(intensity, mids, highs);
    this.animateSphere(intensity, bassHit);
    this.updateMiniBurst(intensity);
    this.updateTouchOrbiters(intensity);
    this.updateCameraView(intensity);
    this.drawWave(intensity);
    this.drawOverlay(intensity);

    this.renderer.render(this.scene, this.camera);
  }
};

const UILayer = {
  togglePlaylist(e) {
    if (e) e.stopPropagation();
    const s = document.getElementById('playlist-screen');
    s.style.display = s.style.display === 'flex' ? 'none' : 'flex';
  },
  changeColor(e) {
    if (e) e.stopPropagation();
    State.hue = (State.hue + 22) % 360;
    document.documentElement.style.setProperty('--hue', State.hue);
  },
  buildPlaylist() {
    const list = document.getElementById('track-list');
    list.innerHTML = '';
    playlist.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item';
      item.innerText = songTitles[t] || t;
      item.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        State.trackIndex = i;
        AudioLayer.loadTrack(i);
        this.togglePlaylist();
      });
      list.appendChild(item);
    });
  }
};

const InputLayer = {
  handle(e) {
    if (e.target.closest('#hud') || e.target.closest('#playlist-screen')) return;
    if (!State.started) {
      AudioLayer.init();
      VisualLayer.init();
      UILayer.buildPlaylist();
      State.started = true;
      AudioLayer.loadTrack(0);
    } else {
      AudioLayer.ensureRunning();
    }
    VisualLayer.spawnTouchOrbiters(e);
  },
  skip(n, e) {
    if (e) e.stopPropagation();
    if (!State.started) return;
    State.trackIndex = (State.trackIndex + n + playlist.length) % playlist.length;
    AudioLayer.loadTrack(State.trackIndex);
  }
};

AudioLayer.audio.onended = () => InputLayer.skip(1);
AudioLayer.audio.addEventListener('error', () => InputLayer.skip(1));
window.addEventListener('resize', () => VisualLayer.resize());

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
